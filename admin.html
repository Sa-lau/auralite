<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>後台管理 · 極晶閣 Auralite</title>
<meta name="description" content="極晶閣後台:產品與庫存管理、訂單與成本毛利分析、Email 設定、資料備份。">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><path d='M20 2 L33 13 L28 34 L12 34 L7 13 Z' fill='%2314b8a6'/></svg>">
</head>
<body>
<header id="nav"></header>

<!-- ===== 登入閘 ===== -->
<div id="gate" class="gate">
  <div class="card gate-card">
    <div class="brand" style="justify-content:center;margin-bottom:18px">🔮<span>極晶閣<span class="brand-sub">ADMIN</span></span></div>
    <h2 class="h-2 center">後台管理登入</h2>
    <div class="field" style="margin-top:20px">
      <label class="label">管理帳號</label>
      <input type="text" class="input" id="loginInput" placeholder="auralite" autocomplete="off">
    </div>
    <div class="field" style="margin-top:12px">
      <label class="label">管理密碼</label>
      <input type="password" class="input" id="passInput" placeholder="••••••••" autocomplete="off">
    </div>
    <button class="btn btn-primary btn-block" id="btnUnlock" style="margin-top:16px">解鎖後台</button>
    <p class="tiny" id="gateErr" style="color:var(--danger);margin-top:10px;display:none">密碼錯誤,請重試。</p>
    <a href="index.html" class="tiny faint" style="display:block;text-align:center;margin-top:16px">← 返回店鋪首頁</a>
  </div>
</div>

<!-- ===== 後台主體 ===== -->
<main id="admin" style="display:none">
  <section class="section-sm">
    <div class="wrap">
      <div class="row-between wrap-row" style="margin-bottom:18px">
        <div>
          <h1 class="h-1">後台總覽</h1>
          <p class="tiny muted">所有數據儲存於本機瀏覽器（localStorage）。</p>
        </div>
        <button class="btn btn-ghost btn-sm" id="btnLock">登出 / 鎖定</button>
      </div>
      <div class="kpi-grid" id="kpiGrid"></div>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="wrap">
      <div class="tabs" id="tabs">
        <button class="tab on" data-tab="products">產品 / 庫存</button>
        <button class="tab" data-tab="services">加購服務</button>
        <button class="tab" data-tab="crystals">晶石可見性</button>
        <button class="tab" data-tab="orders">訂單 / 毛利</button>
        <button class="tab" data-tab="settings">系統設定</button>
        <button class="tab" data-tab="backup">資料備份</button>
      </div>
      <div id="tabBody"></div>
    </div>
  </section>
</main>

<footer id="footer"></footer>

<!-- 共用 modal -->
<div class="modal-mask" id="modalMask"><div class="modal" id="modalBox"></div></div>

<script src="assets/js/bazi.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/app.js"></script>
<script>
App.boot('admin.html');
const S = Store, CD = CrystalData;
let unlocked = false;

/* ===== 登入 ===== */
function tryUnlock() {
  const s = S.getSettings();
  const login = document.getElementById('loginInput').value.trim();
  const v = document.getElementById('passInput').value;
  const loginOk = !s.adminLogin || login === s.adminLogin;
  if (loginOk && v === s.adminPass) {
    unlocked = true;
    document.getElementById('gate').style.display = 'none';
    document.getElementById('admin').style.display = 'block';
    renderAll();
  } else {
    const e = document.getElementById('gateErr');
    e.textContent = loginOk ? '密碼錯誤,請重試。' : '帳號或密碼錯誤,請重試。';
    e.style.display = 'block';
    document.getElementById('passInput').value = '';
  }
}
document.getElementById('loginInput').value = S.getSettings().adminLogin || '';
document.getElementById('btnUnlock').onclick = tryUnlock;
document.getElementById('passInput').addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
document.getElementById('loginInput').addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
document.getElementById('btnLock').onclick = () => { unlocked = false; location.reload(); };

/* ===== 通用 modal ===== */
function openModal(html, wide) {
  const m = document.getElementById('modalMask'), b = document.getElementById('modalBox');
  b.className = 'modal' + (wide ? ' modal-lg' : '');
  b.innerHTML = html + `<div class="row wrap-row" style="gap:8px;margin-top:22px;justify-content:flex-end">
    <button class="btn btn-ghost btn-sm" onclick="closeModal()">關閉</button></div>`;
  m.classList.add('open');
}
window.closeModal = function () { document.getElementById('modalMask').classList.remove('open'); };
document.getElementById('modalMask').onclick = e => { if (e.target.id === 'modalMask') closeModal(); };

/* ===== 工具 ===== */
function money(n) { return 'HK$' + Number(n || 0).toLocaleString('en-US'); }
function margin(p, c) { return p ? ((p - c) / p * 100).toFixed(1) + '%' : '—'; }
function elPill(e) { return `<span class="wx wx-${e}"><span class="dot"></span>${e}</span>`; }
function buildProduct(crystalId, form, spec, price, cost, stock, note) {
  const c = CD.getCrystal(crystalId);
  return {
    id: crystalId + '-' + form,
    sku: (crystalId.slice(0, 3) + form.slice(0, 2) + (spec || '').replace(/[^0-9]/g, '')).toUpperCase().replace(/[^A-Z0-9]/g, ''),
    crystalId, name: c.name, en: c.en, element: c.element, colors: c.colors,
    form, formLabel: CD.FORM_LABEL[form] || form, spec: spec || '',
    price: +price, cost: +cost, stock: +stock, note: note || '',
    chakra: c.chakra, hardness: c.hardness, origin: c.origin, benefits: c.benefits, active: true,
    img: ''
  };
}

/* ===== KPI ===== */
function renderKpi() {
  const s = S.stats();
  const cards = [
    { v: money(s.revenue), l: '總營收', c: 'var(--gold)' },
    { v: money(s.profit), l: '總毛利 (' + s.margin + '%)', c: '#4ade80' },
    { v: money(s.inventoryValue), l: '庫存成本價值', c: 'var(--accent)' },
    { v: s.lowStock.length + s.outStock.length, l: '低/缺貨品項', c: '#fb7185' }
  ];
  document.getElementById('kpiGrid').innerHTML = cards.map(k => `
    <div class="card kpi"><div class="kpi-v" style="color:${k.c}">${k.v}</div><div class="kpi-l">${k.l}</div></div>`).join('');
}

/* ===== Tabs ===== */
function renderAll() { renderKpi(); switchTab(curTab); }
let curTab = 'products';
function switchTab(t) {
  curTab = t;
  document.querySelectorAll('#tabs .tab').forEach(x => x.classList.toggle('on', x.dataset.tab === t));
  ({ products: renderProducts, services: renderServices, crystals: renderCrystals, orders: renderOrders, settings: renderSettings, backup: renderBackup }[t])();
}
document.querySelectorAll('#tabs .tab').forEach(b => b.onclick = () => switchTab(b.dataset.tab));

/* ===== 產品管理 ===== */
let PB = [];
const _cList = CD.CRYSTALS.map(c => ({ v: c.id, t: c.name + '（' + c.element + '）' }));
const _fList = Object.entries(CD.FORM_LABEL).map(([k, v]) => ({ v: k, t: v }));
function _opts(list, val) { return list.map(o => `<option value="${o.v}" ${o.v === val ? 'selected' : ''}>${o.t}</option>`).join(''); }

function renderProducts() {
  PB = S.getProducts().map(p => Object.assign({}, p));
  drawProducts();
}

function drawProducts() {
  const rows = PB.map((p, idx) => {
    const sc = +p.stock === 0 ? 'color:var(--danger)' : (+p.stock <= S.getSettings().lowStockAlert ? 'color:var(--warn)' : '');
    return `<tr data-idx="${idx}">
      <td><select class="cell-sel" data-f="crystalId">${_opts(_cList, p.crystalId)}</select></td>
      <td><select class="cell-sel" data-f="form">${_opts(_fList, p.form)}</select></td>
      <td><input class="cell-in" data-f="spec" value="${App.esc(p.spec || '')}" placeholder="10mm"></td>
      <td><input class="cell-num" type="number" min="0" data-f="price" value="${p.price}"></td>
      <td><input class="cell-num" type="number" min="0" data-f="cost" value="${p.cost}"></td>
      <td style="${sc}"><input class="cell-num sm" type="number" min="0" data-f="stock" value="${p.stock}"></td>
      <td class="num tiny faint" data-m="${idx}">${margin(p.price, p.cost)}</td>
      <td class="tiny"><button class="btn btn-ghost btn-xs" data-img="${idx}">設圖</button>${p.img ? ' ✓' : ''}</td>
      <td class="row" style="gap:5px;justify-content:flex-end"><button class="btn btn-danger btn-xs" data-del="${idx}">刪除</button></td>
    </tr>`;
  }).join('');
  document.getElementById('tabBody').innerHTML = `
    <div class="row-between wrap-row" style="margin-bottom:14px">
      <div class="tiny muted">共 ${PB.length} 項產品 · 可直接於下表編輯,改完按「儲存全部變更」</div>
      <div class="row wrap-row" style="gap:8px">
        <button class="btn btn-ghost btn-sm" id="btnAddRow">＋ 新增一列</button>
        <button class="btn btn-primary btn-sm" id="btnSaveProd">儲存全部變更</button>
      </div>
    </div>
    <div class="table-wrap"><table class="tbl">
      <thead><tr><th>水晶</th><th>形態</th><th>規格</th><th class="num">售價</th><th class="num">成本</th><th class="num">庫存</th><th class="num">毛利%</th><th>圖</th><th></th></tr></thead>
      <tbody id="prodBody">${rows}</tbody>
    </table></div>`;

  document.getElementById('btnAddRow').onclick = () => {
    PB.push({ crystalId: CD.CRYSTALS[0].id, form: 'bracelet', spec: '', price: 0, cost: 0, stock: 0, note: '', img: '' });
    drawProducts();
  };
  document.getElementById('btnSaveProd').onclick = saveProductsAll;

  const body = document.getElementById('prodBody');
  body.addEventListener('input', e => {
    const tr = e.target.closest('tr'); if (!tr) return;
    const idx = +tr.dataset.idx; const f = e.target.dataset.f; if (!f) return;
    let v = e.target.value;
    if (f === 'price' || f === 'cost' || f === 'stock') v = Math.max(0, Math.floor(+v || 0));
    PB[idx][f] = v;
    if (f === 'price' || f === 'cost') { const cell = body.querySelector('[data-m="' + idx + '"]'); if (cell) cell.textContent = margin(PB[idx].price, PB[idx].cost); }
  });
  body.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { PB.splice(+b.dataset.del, 1); drawProducts(); });
  body.querySelectorAll('[data-img]').forEach(b => b.onclick = () => openRowImageModal(+b.dataset.img));
}

function saveProductsAll() {
  const ids = new Set();
  for (const p of PB) {
    const price = Math.max(0, +p.price || 0), cost = Math.max(0, +p.cost || 0), stock = Math.max(0, +p.stock || 0);
    if (price <= 0) { App.toast('有商品售價為 0,請先填寫售價', 'err'); return; }
    const np = buildProduct(p.crystalId, p.form, p.spec, price, cost, stock, p.note);
    np.img = p.img || '';
    np.id = p.id || np.id;
    if (ids.has(np.id)) { App.toast('SKU 重複:' + np.id, 'err'); return; }
    ids.add(np.id);
    p._built = np;
  }
  const keepIds = PB.map(p => p._built.id);
  S.getProducts().slice().forEach(p => { if (!keepIds.includes(p.id)) S.deleteProduct(p.id); });
  PB.forEach(p => S.upsertProduct(p._built));
  App.toast('已儲存全部變更', 'ok');
  renderProducts(); renderKpi();
}

function openRowImageModal(idx) {
  const p = PB[idx];
  openModal(`
    <h2 class="h-3">設定產品圖片</h2>
    <div class="img-edit" style="margin-top:14px">
      <div class="img-prev" id="ri_prev">${p.img ? `<img src="${App.esc(p.img)}" alt="">` : '<span class="tiny muted">尚無圖片</span>'}</div>
      <div class="img-tools">
        <input type="file" id="ri_file" accept="image/*" class="input">
        <input class="input" id="ri_url" value="${p.img && p.img.indexOf('data:') !== 0 ? App.esc(p.img) : ''}" placeholder="或貼圖片網址 / 路徑">
        <div class="tiny muted">建議原圖白底;上傳後自動壓成 800px</div>
      </div>
    </div>
    <div class="row wrap-row" style="gap:8px;margin-top:16px;justify-content:flex-end">
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">取消</button>
      <button class="btn btn-primary btn-sm" id="ri_ok">確定</button>
    </div>`, true);
  let pending = null;
  document.getElementById('ri_file').onchange = ev => {
    const f = ev.target.files && ev.target.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = e => {
      const im = new Image();
      im.onload = () => {
        const max = 800, scale = Math.min(1, max / Math.max(im.width, im.height));
        const w = Math.max(1, Math.round(im.width * scale)), h = Math.max(1, Math.round(im.height * scale));
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        const cx = cv.getContext('2d'); cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, w, h); cx.drawImage(im, 0, 0, w, h);
        pending = cv.toDataURL('image/jpeg', 0.82);
        document.getElementById('ri_prev').innerHTML = `<img src="${pending}" alt="">`;
        document.getElementById('ri_url').value = '';
      };
      im.src = e.target.result;
    };
    reader.readAsDataURL(f);
  };
  document.getElementById('ri_url').oninput = ev => { const u = ev.target.value.trim(); pending = null; document.getElementById('ri_prev').innerHTML = u ? `<img src="${u}" alt="">` : '<span class="tiny muted">尚無圖片</span>'; };
  document.getElementById('ri_ok').onclick = () => {
    const u = document.getElementById('ri_url').value.trim();
    PB[idx].img = pending || u || p.img || '';
    closeModal(); drawProducts();
  };
}

/* 產品編輯已改為列表內聯編輯,見 renderProducts / drawProducts / saveProductsAll */

/* ===== 加購服務管理 ===== */
let SB = [];
function renderServices() {
  SB = Store.getServices().map(s => Object.assign({}, s));
  drawServices();
}
function drawServices() {
  const rows = SB.map((s, idx) => `
    <tr data-idx="${idx}">
      <td><input class="cell-in" data-f="id" value="${App.esc(s.id)}" placeholder="svc-xxx"></td>
      <td><input class="cell-in" data-f="name" value="${App.esc(s.name)}" placeholder="名稱"></td>
      <td><input class="cell-in" data-f="en" value="${App.esc(s.en || '')}" placeholder="English"></td>
      <td><input class="cell-num" type="number" min="0" data-f="price" value="${s.price}"></td>
      <td><input class="cell-num" type="number" min="0" data-f="cost" value="${s.cost}"></td>
      <td><input class="cell-in" style="width:46px;text-align:center" data-f="icon" value="${App.esc(s.icon || '')}" placeholder="☯"></td>
      <td><input class="cell-in" data-f="desc" value="${App.esc(s.desc || '')}" placeholder="說明"></td>
      <td class="row" style="gap:5px;justify-content:flex-end"><button class="btn btn-danger btn-xs" data-del="${idx}">刪除</button></td>
    </tr>`).join('');
  document.getElementById('tabBody').innerHTML = `
    <div class="tiny muted" style="margin-bottom:14px">共 ${SB.length} 項加購服務 · 可直接編輯,改完按「儲存全部變更」。此處服務會出現在選購頁與八字頁的「加購定制服務」區。</div>
    <div class="row wrap-row" style="gap:8px;margin-bottom:14px">
      <button class="btn btn-ghost btn-sm" id="btnAddSvc">＋ 新增服務</button>
      <button class="btn btn-primary btn-sm" id="btnSaveSvc">儲存全部變更</button>
    </div>
    <div class="table-wrap"><table class="tbl">
      <thead><tr><th>ID</th><th>名稱</th><th>英文</th><th class="num">售價</th><th class="num">成本</th><th>圖標</th><th>說明</th><th></th></tr></thead>
      <tbody id="svcBody">${rows}</tbody>
    </table></div>`;
  document.getElementById('btnAddSvc').onclick = () => { SB.push({ id: 'svc-' + (Date.now() + '').slice(-6), name: '新服務', en: 'New Service', price: 0, cost: 0, icon: '✦', desc: '' }); drawServices(); };
  document.getElementById('btnSaveSvc').onclick = saveServicesAll;
  const body = document.getElementById('svcBody');
  body.addEventListener('input', e => {
    const tr = e.target.closest('tr'); if (!tr) return;
    const idx = +tr.dataset.idx; const f = e.target.dataset.f; if (!f) return;
    let v = e.target.value;
    if (f === 'price' || f === 'cost') v = Math.max(0, Math.floor(+v || 0));
    SB[idx][f] = v;
  });
  body.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { SB.splice(+b.dataset.del, 1); drawServices(); });
}
function saveServicesAll() {
  const ids = new Set();
  for (const s of SB) {
    if (!s.id || !s.id.trim()) { App.toast('有服務 ID 空白', 'err'); return; }
    if (!s.name || !s.name.trim()) { App.toast('有服務名稱空白', 'err'); return; }
    if (ids.has(s.id)) { App.toast('服務 ID 重複:' + s.id, 'err'); return; }
    ids.add(s.id);
    s.id = s.id.trim(); s.name = (s.name || '').trim(); s.en = (s.en || '').trim();
    s.desc = (s.desc || '').trim(); s.icon = (s.icon || '').trim() || '✦';
    s.price = Math.max(0, +s.price || 0); s.cost = Math.max(0, +s.cost || 0);
  }
  Store.saveServices(SB.map(s => Object.assign({}, s)));
  App.toast('已儲存加購服務', 'ok');
  renderServices();
}

/* ===== 晶石可見性（書中水晶 / 全站晶石 後台開關） ===== */
function renderCrystals() {
  const all = CD.CRYSTALS.slice();
  const hidden = Store.getHiddenCrystals();
  const prodCount = id => Store.getProducts().filter(p => p.crystalId === id).length;
  const rows = all.map(c => {
    const vis = !hidden.includes(c.id);
    return `<tr>
      <td><span class="wx wx-${c.element}"><span class="dot"></span>${c.element}</span></td>
      <td><strong>${App.esc(c.name)}</strong><div class="tiny faint">${App.esc(c.en)}</div></td>
      <td class="tiny">${c.colors.map(x => `<span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${x};margin-right:3px;vertical-align:middle"></span>`).join('')}${App.esc(c.chakra || '')}</td>
      <td class="num tiny">${prodCount(c.id)}</td>
      <td>${c.book ? '<span class="badge soft">書中</span>' : ''}</td>
      <td class="row" style="justify-content:flex-end">
        <label class="switch"><input type="checkbox" data-cid="${c.id}" ${vis ? 'checked' : ''}><span class="slider"></span></label>
        <span class="tiny ${vis ? 'pos' : 'muted'}" style="margin-left:8px">${vis ? '顯示於選購' : '已隱藏'}</span>
      </td>
    </tr>`;
  }).join('');
  document.getElementById('tabBody').innerHTML = `
    <div class="card">
      <div class="row-between wrap-row" style="margin-bottom:10px">
        <div><h3 class="h-3">晶石可見性 · 後台開關</h3>
        <p class="tiny muted" style="margin-top:6px;max-width:640px">「晶石選購」頁只會顯示已開啟的晶石;「水晶百科」則永遠顯示全部（兩邊資料互通）。<br>
        書中水晶（標記「書中」）預設為<b>隱藏</b>,您可在這裡逐個打開,讓它出現在選購頁。關閉則從選購頁消失,但不影響百科。</p></div>
        <button class="btn btn-ghost btn-sm" id="cr_showAll">全部顯示</button>
      </div>
      <div class="table-wrap" style="margin-top:8px"><table class="tbl">
        <thead><tr><th>五行</th><th>晶石</th><th>顏色 / 輪位</th><th class="num">產品數</th><th></th><th class="num">選購頁顯示</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>`;
  document.querySelectorAll('#tabBody input[data-cid]').forEach(cb => cb.onchange = () => {
    Store.setCrystalVisible(cb.dataset.cid, cb.checked);
    const lbl = cb.closest('td').querySelector('.tiny');
    if (lbl) { lbl.textContent = cb.checked ? '顯示於選購' : '已隱藏'; lbl.className = 'tiny ' + (cb.checked ? 'pos' : 'muted'); }
  });
  const allBtn = document.getElementById('cr_showAll');
  if (allBtn) allBtn.onclick = () => { Store.setHiddenCrystals([]); App.toast('已顯示全部晶石', 'ok'); renderCrystals(); };
}

/* ===== 訂單管理 ===== */
function renderOrders() {
  const os = S.getOrders();
  const rows = os.map(o => `<tr>
    <td class="mono tiny">${o.no}</td>
    <td>${App.esc(o.customer.name)}</td>
    <td class="num">${money(o.total)}</td>
    <td class="num">${money(o.profit)}</td>
    <td class="num">${o.margin}%</td>
    <td>${statusSelect(o)}</td>
    <td class="row wrap-row" style="gap:5px;justify-content:flex-end">
      <button class="btn btn-ghost btn-sm" data-view="${o.no}">明細</button>
      <button class="btn btn-danger btn-sm" data-odel="${o.no}">刪</button>
    </td>
  </tr>`).join('');
  document.getElementById('tabBody').innerHTML = `
    <div class="tiny muted" style="margin-bottom:14px">共 ${os.length} 筆訂單（含已取消）。成本毛利為內部資訊。</div>
    <div class="table-wrap"><table class="tbl">
      <thead><tr><th>編號</th><th>客戶</th><th class="num">總額</th><th class="num">毛利</th><th class="num">毛利率%</th><th>狀態</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => viewOrder(b.dataset.view));
  document.querySelectorAll('[data-odel]').forEach(b => b.onclick = () => {
    if (confirm('確定刪除 ' + b.dataset.odel + '?')) { S.deleteOrder(b.dataset.odel); renderOrders(); renderKpi(); App.toast('已刪除'); }
  });
  document.querySelectorAll('[data-st]').forEach(sel => sel.onchange = () => { S.updateOrder(sel.dataset.st, { status: sel.value }); App.toast('狀態已更新'); renderOrders(); renderKpi(); });
}
function statusSelect(o) {
  return `<select class="select" style="width:auto;padding:5px 8px;font-size:.8rem" data-st="${o.no}">
    ${Store.ORDER_STATUSES.map(s => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}</select>`;
}
function viewOrder(no) {
  const o = S.getOrder(no); if (!o) return;
  const items = o.items.map(it => `<tr><td>${App.esc(it.name)}${it.spec ? ' ' + App.esc(it.spec) : ''}${it.element !== '—' ? ' · ' + it.element : ''}</td><td class="num">×${it.qty}</td><td class="num">${money(it.lineTotal)}</td><td class="num">${money(it.lineCost)}</td><td class="num">${money(it.lineTotal - it.lineCost)}</td></tr>`).join('');
  const bazi = o.bazi ? `<p class="tiny muted" style="margin-bottom:10px">命盤 ${o.bazi.pillars.map(p => p.gz).join(' ')} ｜ 日主 ${o.bazi.dayMaster.yy}${o.bazi.dayMaster.el} ${o.bazi.strength} ｜ 喜用 ${o.bazi.favor.join('、')}</p>` : '';
  const hasConsult = o.items.some(it => it.id === 'svc-consult');
  const ship = o.customer.shipMethod ? `｜ 取貨 ${App.esc(o.customer.shipMethod)}` : '';
  const pay = o.customer.payMethod ? `｜ 付款 ${App.esc(o.customer.payMethod)}` : '';
  const note = o.customer.note ? `<div class="grid g2" style="gap:20px"><div></div><div><h4 class="cd-h">備註</h4><p class="cd-text">${App.esc(o.customer.note)}</p></div></div>` : '';
  openModal(`
    <h2 class="h-2">訂單 ${o.no}</h2>
    <p class="tiny muted">${new Date(o.createdAt).toLocaleString('zh-HK')} ｜ 狀態 <span class="status-badge ${App.statusClass(o.status)}">${o.status}</span></p>
    ${bazi}
    <div class="grid g2" style="gap:20px;margin-top:10px">
      <div><h4 class="cd-h">收件人</h4><p class="cd-text">${App.esc(o.customer.name)} ｜ ${App.esc(o.customer.phone)}</p>${o.customer.email ? `<p class="cd-text">${App.esc(o.customer.email)}</p>` : ''}${o.customer.address ? `<p class="cd-text">${App.esc(o.customer.address)}</p>` : ''}${ship}${pay}</div>
      <div><h4 class="cd-h">通知</h4><p class="cd-text">${o.emailSent ? '✓ 已寄出 (' + App.esc(o.emailProvider || '') + ')' : (o.emailError ? '✗ ' + App.esc(o.emailError) : '未寄出')}</p></div>
    </div>
    ${note}
    <div class="card" style="margin-top:14px">
      <h4 class="cd-h">出貨資料</h4>
      <div class="grid g2" style="gap:12px;margin-top:8px">
        <div class="field" style="margin:0"><label class="label">物流追蹤號 / 出貨備註</label><input class="input" id="ov_track" value="${App.esc(o.tracking || '')}" placeholder="如 SF1234567890 / 已交寄"></div>
        <div class="field" style="margin:0"><label class="label">狀態</label><select class="select" id="ov_status">${S.ORDER_STATUSES.map(s => `<option value="${s}" ${o.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
      </div>
      <button class="btn btn-primary btn-sm" id="ov_saveShip" style="margin-top:10px">儲存出貨資料</button>
      <span id="ov_shipMsg" class="tiny muted" style="margin-left:8px"></span>
    </div>
    ${hasConsult ? `
    <div class="card" style="margin-top:14px;border-color:rgba(124,58,237,.35)">
      <h4 class="cd-h" style="color:#6d28d9">八字深度解析報告 · 個人筆記</h4>
      <p class="tiny muted" style="margin-top:4px">此訂單含「八字深度解析報告」,請填寫針對 <b>${App.esc(o.customer.name)}</b> 的專屬解盤內容,可從下方「套用預設筆記」按鈕帶入系統設定的預設範本再修改。</p>
      <div class="field" style="margin-top:10px"><label class="label">個人八字筆記 (僅此客戶)</label><textarea class="textarea" id="ov_bazi" style="min-height:140px" placeholder="輸入給此客戶的專屬報告…">${App.esc(o.baziReportNotes || '')}</textarea></div>
      <div class="row wrap-row" style="gap:10px;margin-top:10px">
        <button class="btn btn-primary btn-sm" id="ov_saveBazi">儲存報告</button>
        <button class="btn btn-ghost btn-sm" id="ov_default">套用預設筆記</button>
        <button class="btn btn-primary btn-sm" id="ov_sendBazi">寄送報告 Email 給客戶</button>
        <span id="ov_baziMsg" class="tiny muted"></span>
      </div>
    </div>` : ''}
    <div class="table-wrap" style="margin-top:14px"><table class="tbl">
      <thead><tr><th>品項</th><th class="num">數量</th><th class="num">小計</th><th class="num">成本</th><th class="num">毛利</th></tr></thead>
      <tbody>${items}</tbody>
    </table></div>
    <div style="max-width:300px;margin-left:auto;margin-top:14px">
      <div class="row-between"><span class="muted">商品小計</span><span class="mono">${money(o.subtotal)}</span></div>
      <div class="row-between"><span class="muted">運費</span><span class="mono">${o.shipping ? money(o.shipping) : '免運'}</span></div>
      <div class="row-between" style="margin-top:6px;padding-top:6px;border-top:1px solid var(--border)"><span>總額</span><span class="mono" style="color:var(--gold)">${money(o.total)}</span></div>
      <div class="row-between tiny faint" style="margin-top:4px"><span>總成本 ${money(o.totalCost)} · 毛利 ${money(o.profit)}</span></div>
    </div>`, true);
  const ovSaveShip = document.getElementById('ov_saveShip');
  if (ovSaveShip) ovSaveShip.onclick = () => {
    S.updateOrder(no, { tracking: document.getElementById('ov_track').value.trim(), status: document.getElementById('ov_status').value });
    document.getElementById('ov_shipMsg').textContent = '已儲存 ✓';
    setTimeout(() => document.getElementById('ov_shipMsg').textContent = '', 2000);
    renderOrders();
  };
  if (hasConsult) {
    const ta = document.getElementById('ov_bazi');
    document.getElementById('ov_saveBazi').onclick = () => {
      S.updateOrder(no, { baziReportNotes: ta.value });
      document.getElementById('ov_baziMsg').textContent = '已儲存 ✓';
      setTimeout(() => document.getElementById('ov_baziMsg').textContent = '', 2000);
    };
    document.getElementById('ov_default').onclick = () => {
      const def = (S.getSettings().baziNotes || '').trim();
      ta.value = def ? def + (ta.value ? '\n\n— — —\n' + ta.value : '') : ta.value;
      App.toast('已套用預設筆記,可再編輯', 'ok');
    };
    document.getElementById('ov_sendBazi').onclick = async () => {
      S.updateOrder(no, { baziReportNotes: ta.value });
      const btn = document.getElementById('ov_sendBazi'); btn.disabled = true; btn.textContent = '寄送中…';
      const r = await S.sendCustomerEmail(S.getOrder(no));
      btn.disabled = false; btn.textContent = '寄送報告 Email 給客戶';
      document.getElementById('ov_baziMsg').textContent = (r.ok ? '✓ ' : '✗ ') + r.msg;
      if (r.ok) { S.updateOrder(no, { status: 'PDF' }); App.toast('報告已寄出,狀態更新為 PDF', 'ok'); renderOrders(); }
      else App.toast(r.msg, 'err');
    };
  }
}

/* ===== 系統設定 ===== */
function renderSettings() {
  const s = S.getSettings();
  document.getElementById('tabBody').innerHTML = `
    <div class="grid g2" style="gap:18px;align-items:start">
      <div class="card">
        <h3 class="h-3">店鋪與費用</h3>
        <div class="field" style="margin-top:12px"><label class="label">店鋪名稱</label><input class="input" id="s_shop" value="${App.esc(s.shopName)}"></div>
        <div class="field" style="margin-top:10px"><label class="label">收件 Email（訂單通知發往此）</label><input class="input" id="s_owner" value="${App.esc(s.ownerEmail)}" placeholder="you@example.com"></div>
        <div class="field" style="margin-top:10px"><label class="label">運費 (HK$, 未達免運門檻時)</label><input class="input" id="s_ship" type="number" value="${s.shippingFee}"></div>
        <div class="field" style="margin-top:10px"><label class="label">免運門檻 (HK$)</label><input class="input" id="s_free" type="number" value="${s.freeShipAbove}"></div>
        <div class="field" style="margin-top:10px"><label class="label">稅率 (%)</label><input class="input" id="s_tax" type="number" step="0.1" value="${s.taxRate}"></div>
        <div class="field" style="margin-top:10px"><label class="label">低庫存警示線 (件)</label><input class="input" id="s_low" type="number" value="${s.lowStockAlert}"></div>
      </div>
      <div class="card">
        <h3 class="h-3">Email 通知服務</h3>
        <div class="field" style="margin-top:12px"><label class="label">服務商</label>
          <select class="select" id="s_provider">
            <option value="none" ${s.provider === 'none' ? 'selected' : ''}>尚未設定 (none)</option>
            <option value="web3forms" ${s.provider === 'web3forms' ? 'selected' : ''}>Web3Forms（最簡單,免註冊 API key）</option>
            <option value="formspree" ${s.provider === 'formspree' ? 'selected' : ''}>Formspree</option>
            <option value="emailjs" ${s.provider === 'emailjs' ? 'selected' : ''}>EmailJS</option>
          </select>
        </div>
        <div id="provFields"></div>
        <div class="field" style="margin-top:10px"><label class="row" style="gap:8px;cursor:pointer"><input type="checkbox" id="s_notifyC" ${s.notifyCustomer ? 'checked' : ''}><span class="label" style="margin:0">同時發送確認信給客戶</span></label></div>
      </div>
      <div class="card">
        <h3 class="h-3">管理帳號與密碼</h3>
        <div class="field" style="margin-top:12px"><label class="label">管理帳號 (Login)</label><input class="input" id="s_login" value="${App.esc(s.adminLogin)}" placeholder="登入帳號"></div>
        <div class="field" style="margin-top:10px"><label class="label">目前密碼</label><input class="input" id="s_cur" type="password" placeholder="確認身分"></div>
        <div class="field" style="margin-top:10px"><label class="label">新密碼</label><input class="input" id="s_new" type="password" placeholder="留空則不修改"></div>
        <p class="tiny muted" style="margin-top:8px">修改密碼需先輸入目前密碼。帳號留空則登入時只需密碼。</p>
      </div>
      <div class="card">
        <h3 class="h-3">八字報告 · 個人筆記</h3>
        <p class="tiny muted" style="margin-top:6px">下方已預填一份<b>預設解盤範本</b>,您可直接修改成自己的風格,客戶選購「八字深度解析報告」時會看見;也能在此連結您的報告模板(PDF / 網頁)。</p>
        <div class="field" style="margin-top:12px"><label class="label">個人八字筆記 / 解盤說明</label><textarea class="textarea" id="s_baziNotes" style="min-height:180px" placeholder="例如:本店以子平格局派為主,重視調候與用神…">${App.esc((s.baziNotes && s.baziNotes.trim()) ? s.baziNotes : (S.DEFAULT_SETTINGS && S.DEFAULT_SETTINGS.baziNotes || ''))}</textarea></div>
        <div class="field" style="margin-top:10px"><label class="label">報告模板連結 (PDF / 網頁)</label><input class="input" id="s_baziUrl" value="${App.esc(s.baziReportUrl || '')}" placeholder="https://…"></div>
        <div class="info-box" style="margin-top:12px">
          <b>📄 如何生成 PDF 報告？</b>
          <ol style="margin:6px 0 0 18px;line-height:1.7">
            <li>客戶在 <code>bazi.html</code> 填出生資料並點「生成我的八字報告」後,頁面會顯示完整命盤。</li>
            <li>在報告區點「<b>下載 / 列印報告</b>」→ 系統開啟列印視窗 → 於「目的地」選「<b>另存為 PDF</b>」即可存成 PDF。</li>
            <li>若您已上傳報告模板連結(上方欄位),客戶會在 Email / 報告頁看到該連結。</li>
            <li>後台「訂單詳情」含八字報告的訂單,可在「個人筆記」填寫專屬內容後,點「<b>寄送報告 Email 給客戶</b>」自動寄出。</li>
          </ol>
        </div>
      </div>
    </div>
    <div class="row wrap-row" style="gap:10px;margin-top:18px">
      <button class="btn btn-primary" id="s_save">儲存設定</button>
      <button class="btn btn-ghost" id="s_test">發送測試郵件</button>
      <span id="s_msg" class="tiny muted"></span>
    </div>`;
  renderProvFields();
  document.getElementById('s_provider').onchange = renderProvFields;
  document.getElementById('s_save').onclick = saveSettings;
  document.getElementById('s_test').onclick = testEmail;
}
function renderProvFields() {
  const s = S.getSettings();
  const p = document.getElementById('s_provider').value;
  let html = '';
  if (p === 'web3forms') html = `<div class="field" style="margin-top:12px"><label class="label">Web3Forms Access Key</label><input class="input" id="s_w3" value="${App.esc(s.web3forms.accessKey)}" placeholder="從 web3forms.com 取得"></div>`;
  if (p === 'formspree') html = `<div class="field" style="margin-top:12px"><label class="label">Formspree Endpoint URL</label><input class="input" id="s_fs" value="${App.esc(s.formspree.endpoint)}" placeholder="https://formspree.io/f/xxxx"></div>`;
  if (p === 'emailjs') html = `<div class="field" style="margin-top:12px"><label class="label">Service ID</label><input class="input" id="s_ej1" value="${App.esc(s.emailjs.serviceId)}"></div>
    <div class="field" style="margin-top:8px"><label class="label">Template ID</label><input class="input" id="s_ej2" value="${App.esc(s.emailjs.templateId)}"></div>
    <div class="field" style="margin-top:8px"><label class="label">Public Key</label><input class="input" id="s_ej3" value="${App.esc(s.emailjs.publicKey)}"></div>`;
  const box = document.getElementById('provFields');
  if (box) box.innerHTML = html;
}
function saveSettings() {
  const patch = {
    shopName: document.getElementById('s_shop').value,
    ownerEmail: document.getElementById('s_owner').value,
    shippingFee: +document.getElementById('s_ship').value || 0,
    freeShipAbove: +document.getElementById('s_free').value || 0,
    taxRate: +document.getElementById('s_tax').value || 0,
    lowStockAlert: +document.getElementById('s_low').value || 0,
    provider: document.getElementById('s_provider').value,
    notifyCustomer: document.getElementById('s_notifyC').checked,
    web3forms: { accessKey: document.getElementById('s_w3') ? document.getElementById('s_w3').value : S.getSettings().web3forms.accessKey },
    formspree: { endpoint: document.getElementById('s_fs') ? document.getElementById('s_fs').value : S.getSettings().formspree.endpoint },
    emailjs: {
      serviceId: document.getElementById('s_ej1') ? document.getElementById('s_ej1').value : S.getSettings().emailjs.serviceId,
      templateId: document.getElementById('s_ej2') ? document.getElementById('s_ej2').value : S.getSettings().emailjs.templateId,
      publicKey: document.getElementById('s_ej3') ? document.getElementById('s_ej3').value : S.getSettings().emailjs.publicKey
    },
    baziNotes: document.getElementById('s_baziNotes') ? document.getElementById('s_baziNotes').value : S.getSettings().baziNotes,
    baziReportUrl: document.getElementById('s_baziUrl') ? document.getElementById('s_baziUrl').value.trim() : S.getSettings().baziReportUrl
  };
  const cur = document.getElementById('s_cur').value, nw = document.getElementById('s_new').value;
  const newLogin = document.getElementById('s_login').value.trim();
  const changingAuth = newLogin !== S.getSettings().adminLogin || !!nw;
  if (changingAuth) {
    if (cur !== S.getSettings().adminPass) { App.toast('修改帳號/密碼需先輸入目前密碼', 'err'); return; }
    patch.adminLogin = newLogin;
    if (nw) patch.adminPass = nw;
  }
  S.saveSettings(patch);
  document.getElementById('s_msg').textContent = '設定已儲存 ✓';
  setTimeout(() => document.getElementById('s_msg').textContent = '', 2500);
  renderKpi();
}
async function testEmail() {
  const msg = document.getElementById('s_msg'); msg.textContent = '發送中…';
  const r = await S.sendTestEmail();
  msg.textContent = (r.ok ? '✓ ' : '✗ ') + r.msg;
  App.toast(r.ok ? '測試郵件已寄出' : r.msg, r.ok ? 'ok' : 'err');
}

/* ===== 資料備份 ===== */
function renderBackup() {
  document.getElementById('tabBody').innerHTML = `
    <div class="grid g2" style="gap:18px;align-items:start">
      <div class="card">
        <h3 class="h-3">匯出</h3>
        <p class="tiny muted" style="margin-top:8px">備份全部設定、產品與訂單為 JSON,或匯出 CSV / XLS 報表。</p>
        <div class="col" style="gap:10px;margin-top:14px">
          <button class="btn btn-primary btn-sm" id="b_json">匯出全部 (JSON)</button>
          <button class="btn btn-ghost btn-sm" id="b_xls">匯出全部工作表 (XLS · Excel 可開)</button>
          <div style="height:6px"></div>
          <button class="btn btn-ghost btn-sm" id="b_ocsv">匯出訂單 (CSV)</button>
          <button class="btn btn-ghost btn-sm" id="b_pcsv">匯出產品 (CSV)</button>
          <button class="btn btn-ghost btn-sm" id="b_scsv">匯出加購服務 (CSV)</button>
          <button class="btn btn-ghost btn-sm" id="b_ccsv">匯出水晶知識 (CSV)</button>
        </div>
      </div>
      <div class="card">
        <h3 class="h-3">匯入 / 重置</h3>
        <p class="tiny muted" style="margin-top:8px">從 JSON 還原（會覆蓋現有設定/產品/訂單）。重置會清空所有本機資料並恢復預設產品。</p>
        <div class="col" style="gap:10px;margin-top:14px">
          <label class="btn btn-ghost btn-sm" style="cursor:pointer">選擇 JSON 匯入<input type="file" id="b_file" accept=".json,application/json" style="display:none"></label>
          <button class="btn btn-danger btn-sm" id="b_reset">重置全部資料</button>
        </div>
      </div>
    </div>`;
  document.getElementById('b_json').onclick = () => App.download('crystal-atelier-backup.json', S.exportJSON(), 'application/json');
  document.getElementById('b_xls').onclick = () => App.download('auralite-export.xls', S.exportXLS(), 'application/vnd.ms-excel');
  document.getElementById('b_ocsv').onclick = () => App.download('orders.csv', S.ordersCSV(), 'text/csv');
  document.getElementById('b_pcsv').onclick = () => App.download('products.csv', S.productsCSV(), 'text/csv');
  document.getElementById('b_scsv').onclick = () => App.download('services.csv', S.servicesCSV(), 'text/csv');
  document.getElementById('b_ccsv').onclick = () => App.download('crystals.csv', S.crystalsCSV(), 'text/csv');
  document.getElementById('b_file').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { S.importJSON(r.result); App.toast('已匯入', 'ok'); renderAll(); } catch (err) { App.toast('匯入失敗: ' + err.message, 'err'); } };
    r.readAsText(f);
  };
  document.getElementById('b_reset').onclick = () => {
    if (confirm('確定重置?這將清空所有訂單、產品與設定,並恢復預設 46 款產品。')) { S.resetAll(); App.toast('已重置'); renderAll(); }
  };
}
</script>
