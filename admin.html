<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>後台管理 · 極晶閣 Auralite</title>
<meta name="description" content="極晶閣後台:產品與庫存管理、訂單與成本毛利分析、Email 設定、資料備份。">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><path d='M20 2 L33 13 L28 34 L12 34 L7 13 Z' fill='%2314b8a6'/></svg>">
</head>
<body>
<header id="nav"></header>

<!-- ===== 登入閘 ===== -->
<div id="gate" class="gate">
  <div class="card gate-card">
    <div class="brand" style="justify-content:center;margin-bottom:18px">🔮<span>極晶閣<span class="brand-sub">ADMIN</span></span></div>
    <h2 class="h-2 center">後台管理登入</h2>
    <p class="tiny muted center" style="margin-top:6px">請輸入管理密碼（預設 crystal2026）</p>
    <div class="field" style="margin-top:20px">
      <label class="label">管理密碼</label>
      <input type="password" class="input" id="passInput" placeholder="••••••••" autocomplete="off">
    </div>
    <button class="btn btn-primary btn-block" id="btnUnlock" style="margin-top:16px">解鎖後台</button>
    <p class="tiny" id="gateErr" style="color:var(--danger);margin-top:10px;display:none">密碼錯誤,請重試。</p>
    <a href="index.html" class="tiny faint" style="display:block;text-align:center;margin-top:16px">← 返回店鋪首頁</a>
  </div>
</div>

<!-- ===== 後台主體 ===== -->
<main id="admin" style="display:none">
  <section class="section-sm">
    <div class="wrap">
      <div class="row-between wrap-row" style="margin-bottom:18px">
        <div>
          <h1 class="h-1">後台總覽</h1>
          <p class="tiny muted">所有數據儲存於本機瀏覽器（localStorage）。</p>
        </div>
        <button class="btn btn-ghost btn-sm" id="btnLock">登出 / 鎖定</button>
      </div>
      <div class="kpi-grid" id="kpiGrid"></div>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="wrap">
      <div class="tabs" id="tabs">
        <button class="tab on" data-tab="products">產品 / 庫存</button>
        <button class="tab" data-tab="orders">訂單 / 毛利</button>
        <button class="tab" data-tab="settings">系統設定</button>
        <button class="tab" data-tab="backup">資料備份</button>
      </div>
      <div id="tabBody"></div>
    </div>
  </section>
</main>

<footer id="footer"></footer>

<!-- 共用 modal -->
<div class="modal-mask" id="modalMask"><div class="modal" id="modalBox"></div></div>

<script src="assets/js/bazi.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/app.js"></script>
<script>
App.boot('admin.html');
const S = Store, CD = CrystalData;
let unlocked = false;

/* ===== 登入 ===== */
function tryUnlock() {
  const v = document.getElementById('passInput').value;
  if (v === S.getSettings().adminPass) {
    unlocked = true;
    document.getElementById('gate').style.display = 'none';
    document.getElementById('admin').style.display = 'block';
    renderAll();
  } else {
    const e = document.getElementById('gateErr'); e.style.display = 'block';
    document.getElementById('passInput').value = '';
  }
}
document.getElementById('btnUnlock').onclick = tryUnlock;
document.getElementById('passInput').addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
document.getElementById('btnLock').onclick = () => { unlocked = false; location.reload(); };

/* ===== 通用 modal ===== */
function openModal(html, wide) {
  const m = document.getElementById('modalMask'), b = document.getElementById('modalBox');
  b.className = 'modal' + (wide ? ' modal-lg' : '');
  b.innerHTML = html + `<div class="row wrap-row" style="gap:8px;margin-top:22px;justify-content:flex-end">
    <button class="btn btn-ghost btn-sm" onclick="closeModal()">關閉</button></div>`;
  m.classList.add('open');
}
window.closeModal = function () { document.getElementById('modalMask').classList.remove('open'); };
document.getElementById('modalMask').onclick = e => { if (e.target.id === 'modalMask') closeModal(); };

/* ===== 工具 ===== */
function money(n) { return 'HK$' + Number(n || 0).toLocaleString('en-US'); }
function margin(p, c) { return p ? ((p - c) / p * 100).toFixed(1) + '%' : '—'; }
function elPill(e) { return `<span class="wx wx-${e}"><span class="dot"></span>${e}</span>`; }
function buildProduct(crystalId, form, spec, price, cost, stock, note) {
  const c = CD.getCrystal(crystalId);
  return {
    id: crystalId + '-' + form,
    sku: (crystalId.slice(0, 3) + form.slice(0, 2) + (spec || '').replace(/[^0-9]/g, '')).toUpperCase().replace(/[^A-Z0-9]/g, ''),
    crystalId, name: c.name, en: c.en, element: c.element, colors: c.colors,
    form, formLabel: CD.FORM_LABEL[form] || form, spec: spec || '',
    price: +price, cost: +cost, stock: +stock, note: note || '',
    chakra: c.chakra, hardness: c.hardness, origin: c.origin, benefits: c.benefits, active: true,
    img: ''
  };
}

/* ===== KPI ===== */
function renderKpi() {
  const s = S.stats();
  const cards = [
    { v: money(s.revenue), l: '總營收', c: 'var(--gold)' },
    { v: money(s.profit), l: '總毛利 (' + s.margin + '%)', c: '#4ade80' },
    { v: money(s.inventoryValue), l: '庫存成本價值', c: 'var(--accent)' },
    { v: s.lowStock.length + s.outStock.length, l: '低/缺貨品項', c: '#fb7185' }
  ];
  document.getElementById('kpiGrid').innerHTML = cards.map(k => `
    <div class="card kpi"><div class="kpi-v" style="color:${k.c}">${k.v}</div><div class="kpi-l">${k.l}</div></div>`).join('');
}

/* ===== Tabs ===== */
function renderAll() { renderKpi(); switchTab(curTab); }
let curTab = 'products';
function switchTab(t) {
  curTab = t;
  document.querySelectorAll('#tabs .tab').forEach(x => x.classList.toggle('on', x.dataset.tab === t));
  ({ products: renderProducts, orders: renderOrders, settings: renderSettings, backup: renderBackup }[t])();
}
document.querySelectorAll('#tabs .tab').forEach(b => b.onclick = () => switchTab(b.dataset.tab));

/* ===== 產品管理 ===== */
function renderProducts() {
  const ps = S.getProducts();
  const rows = ps.map(p => {
    const m = margin(p.price, p.cost);
    const sc = p.stock === 0 ? 'color:var(--danger)' : (p.stock <= S.getSettings().lowStockAlert ? 'color:var(--warn)' : '');
    return `<tr>
      <td class="mono tiny">${App.esc(p.sku)}</td>
      <td><div class="row" style="gap:7px">${elPill(p.element)}${p.img ? `<img class="cell-thumb" src="${App.esc(p.img)}" alt="">` : ''}<div><div style="font-weight:600">${App.esc(p.name)}</div><div class="tiny faint">${App.esc(p.spec || p.formLabel)}</div></div></div></td>
      <td class="num">${money(p.price)}</td>
      <td class="num">${money(p.cost)}</td>
      <td class="num">${m}</td>
      <td class="num" style="${sc}">${p.stock}</td>
      <td class="row wrap-row" style="gap:5px;justify-content:flex-end">
        <button class="btn btn-ghost btn-sm" data-stk="-1" data-id="${p.id}">−</button>
        <button class="btn btn-ghost btn-sm" data-stk="1" data-id="${p.id}">＋</button>
        <button class="btn btn-ghost btn-sm" data-edit="${p.id}">編輯</button>
        <button class="btn btn-danger btn-sm" data-del="${p.id}">刪</button>
      </td>
    </tr>`;
  }).join('');
  document.getElementById('tabBody').innerHTML = `
    <div class="row-between wrap-row" style="margin-bottom:14px">
      <div class="tiny muted">共 ${ps.length} 項產品</div>
      <button class="btn btn-primary btn-sm" id="btnAddProd">＋ 新增產品</button>
    </div>
    <div class="table-wrap"><table class="tbl">
      <thead><tr><th>SKU</th><th>產品</th><th class="num">售價</th><th class="num">成本</th><th class="num">毛利%</th><th class="num">庫存</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
  document.getElementById('btnAddProd').onclick = () => openProductModal(null);
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openProductModal(b.dataset.edit));
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    if (confirm('確定刪除 ' + b.dataset.del + '?')) { S.deleteProduct(b.dataset.del); renderProducts(); renderKpi(); App.toast('已刪除'); }
  });
  document.querySelectorAll('[data-stk]').forEach(b => b.onclick = () => {
    S.adjustStock(b.dataset.id, +b.dataset.stk); renderProducts(); renderKpi();
  });
}

function openProductModal(id) {
  const p = id ? S.getProduct(id) : null;
  const optC = CD.CRYSTALS.map(c => `<option value="${c.id}" ${p && p.crystalId === c.id ? 'selected' : ''}>${c.name}（${c.element}）</option>`).join('');
  const optF = Object.entries(CD.FORM_LABEL).map(([k, v]) => `<option value="${k}" ${p && p.form === k ? 'selected' : ''}>${v}</option>`).join('');
  openModal(`
    <h2 class="h-2">${p ? '編輯產品' : '新增產品'}</h2>
    <div class="grid g2" style="gap:14px;margin-top:18px">
      <div class="field"><label class="label">水晶種類</label><select class="select" id="m_crystal">${optC}</select></div>
      <div class="field"><label class="label">形態</label><select class="select" id="m_form">${optF}</select></div>
      <div class="field"><label class="label">規格（如 10mm / 60mm）</label><input class="input" id="m_spec" value="${p ? App.esc(p.spec) : ''}" placeholder="10mm"></div>
      <div class="field"><label class="label">庫存數量</label><input class="input" id="m_stock" type="number" min="0" value="${p ? p.stock : 0}"></div>
      <div class="field"><label class="label">售價 (HK$)</label><input class="input" id="m_price" type="number" min="0" value="${p ? p.price : 0}"></div>
      <div class="field"><label class="label">成本 (HK$)</label><input class="input" id="m_cost" type="number" min="0" value="${p ? p.cost : 0}"></div>
    </div>
    <div class="field" style="margin-top:14px"><label class="label">備註</label><input class="input" id="m_note" value="${p ? App.esc(p.note) : ''}" placeholder="選料說明 / 產地"></div>
    <div class="field" style="margin-top:14px">
      <label class="label">產品圖片</label>
      <div class="img-edit">
        <div class="img-prev" id="m_imgPrev">${p && p.img ? `<img src="${App.esc(p.img)}" alt="">` : '<span class="tiny muted">尚無圖片</span>'}</div>
        <div class="img-tools">
          <input type="file" id="m_imgFile" accept="image/*" class="input">
          <input class="input" id="m_imgUrl" value="${p && p.img && p.img.indexOf('data:') !== 0 ? App.esc(p.img) : ''}" placeholder="或貼圖片網址 / 相對路徑（如 assets/img/crystals/xxx.jpg）">
          <div class="tiny muted" id="m_imgInfo">建議原圖 1000×1000 以上、白底；上傳後自動壓成 800px 正方形展示圖</div>
        </div>
      </div>
    </div>
    <div class="tiny muted" id="m_margin" style="margin-top:12px"></div>
    <div class="row wrap-row" style="gap:10px;margin-top:18px;justify-content:flex-end">
      <button class="btn btn-primary" id="m_save">${p ? '儲存修改' : '建立產品'}</button>
    </div>`, true);
  const upd = () => {
    const pr = +document.getElementById('m_price').value || 0;
    const co = +document.getElementById('m_cost').value || 0;
    document.getElementById('m_margin').textContent = '預估毛利: ' + money(pr - co) + ' （' + margin(pr, co) + '）';
  };
  ['m_price', 'm_cost'].forEach(i => document.getElementById(i).addEventListener('input', upd));
  upd();
  let pendingImg = null;
  const fileInput = document.getElementById('m_imgFile');
  if (fileInput) fileInput.onchange = ev => {
    const f = ev.target.files && ev.target.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = e => {
      const im = new Image();
      im.onload = () => {
        const max = 800;
        const scale = Math.min(1, max / Math.max(im.width, im.height));
        const w = Math.max(1, Math.round(im.width * scale)), h = Math.max(1, Math.round(im.height * scale));
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        const cx = cv.getContext('2d'); cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, w, h); cx.drawImage(im, 0, 0, w, h);
        const uri = cv.toDataURL('image/jpeg', 0.82);
        pendingImg = uri;
        document.getElementById('m_imgPrev').innerHTML = `<img src="${uri}" alt="">`;
        const kb = Math.round(uri.length * 3 / 4 / 1024);
        document.getElementById('m_imgInfo').textContent = `已壓成 ${w}×${h}px · 約 ${kb} KB`;
        document.getElementById('m_imgUrl').value = '';
      };
      im.src = e.target.result;
    };
    reader.readAsDataURL(f);
  };
  const urlInput = document.getElementById('m_imgUrl');
  if (urlInput) urlInput.oninput = ev => {
    const u = ev.target.value.trim(); pendingImg = null;
    if (u) { document.getElementById('m_imgPrev').innerHTML = `<img src="${u}" alt="">`; document.getElementById('m_imgInfo').textContent = '使用網址 / 路徑'; }
    else { document.getElementById('m_imgPrev').innerHTML = (p && p.img) ? `<img src="${App.esc(p.img)}" alt="">` : '<span class="tiny muted">尚無圖片</span>'; }
  };
  document.getElementById('m_save').onclick = () => {
    const prod = buildProduct(
      document.getElementById('m_crystal').value,
      document.getElementById('m_form').value,
      document.getElementById('m_spec').value,
      document.getElementById('m_price').value,
      document.getElementById('m_cost').value,
      document.getElementById('m_stock').value,
      document.getElementById('m_note').value
    );
    if (p) prod.id = p.id;
    const url = document.getElementById('m_imgUrl') ? document.getElementById('m_imgUrl').value.trim() : '';
    prod.img = pendingImg || url || (p ? p.img : '');
    S.upsertProduct(prod);
    closeModal(); renderProducts(); renderKpi(); App.toast('已儲存');
  };
}

/* ===== 訂單管理 ===== */
function renderOrders() {
  const os = S.getOrders();
  const rows = os.map(o => `<tr>
    <td class="mono tiny">${o.no}</td>
    <td>${App.esc(o.customer.name)}</td>
    <td class="num">${money(o.total)}</td>
    <td class="num">${money(o.profit)}</td>
    <td class="num">${o.margin}%</td>
    <td>${statusSelect(o)}</td>
    <td class="row wrap-row" style="gap:5px;justify-content:flex-end">
      <button class="btn btn-ghost btn-sm" data-view="${o.no}">明細</button>
      <button class="btn btn-danger btn-sm" data-odel="${o.no}">刪</button>
    </td>
  </tr>`).join('');
  document.getElementById('tabBody').innerHTML = `
    <div class="tiny muted" style="margin-bottom:14px">共 ${os.length} 筆訂單（含已取消）。成本毛利為內部資訊。</div>
    <div class="table-wrap"><table class="tbl">
      <thead><tr><th>編號</th><th>客戶</th><th class="num">總額</th><th class="num">毛利</th><th class="num">毛利率%</th><th>狀態</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => viewOrder(b.dataset.view));
  document.querySelectorAll('[data-odel]').forEach(b => b.onclick = () => {
    if (confirm('確定刪除 ' + b.dataset.odel + '?')) { S.deleteOrder(b.dataset.odel); renderOrders(); renderKpi(); App.toast('已刪除'); }
  });
  document.querySelectorAll('[data-st]').forEach(sel => sel.onchange = () => { S.updateOrder(sel.dataset.st, { status: sel.value }); App.toast('狀態已更新'); renderOrders(); renderKpi(); });
}
function statusSelect(o) {
  return `<select class="select" style="width:auto;padding:5px 8px;font-size:.8rem" data-st="${o.no}">
    ${['待處理','已出貨','已完成','已取消'].map(s => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}</select>`;
}
function viewOrder(no) {
  const o = S.getOrder(no); if (!o) return;
  const items = o.items.map(it => `<tr><td>${App.esc(it.name)}${it.spec ? ' ' + App.esc(it.spec) : ''}${it.element !== '—' ? ' · ' + it.element : ''}</td><td class="num">×${it.qty}</td><td class="num">${money(it.lineTotal)}</td><td class="num">${money(it.lineCost)}</td><td class="num">${money(it.lineTotal - it.lineCost)}</td></tr>`).join('');
  const bazi = o.bazi ? `<p class="tiny muted" style="margin-bottom:10px">命盤 ${o.bazi.pillars.map(p => p.gz).join(' ')} ｜ 日主 ${o.bazi.dayMaster.yy}${o.bazi.dayMaster.el} ${o.bazi.strength} ｜ 喜用 ${o.bazi.favor.join('、')}</p>` : '';
  openModal(`
    <h2 class="h-2">訂單 ${o.no}</h2>
    <p class="tiny muted">${new Date(o.createdAt).toLocaleString('zh-HK')} ｜ 狀態 ${o.status}</p>
    ${bazi}
    <div class="grid g2" style="gap:20px;margin-top:10px">
      <div><h4 class="cd-h">收件人</h4><p class="cd-text">${App.esc(o.customer.name)} ｜ ${App.esc(o.customer.phone)}</p>${o.customer.email ? `<p class="cd-text">${App.esc(o.customer.email)}</p>` : ''}${o.customer.address ? `<p class="cd-text">${App.esc(o.customer.address)}</p>` : ''}</div>
      <div><h4 class="cd-h">通知</h4><p class="cd-text">${o.emailSent ? '✓ 已寄出 (' + App.esc(o.emailProvider || '') + ')' : (o.emailError ? '✗ ' + App.esc(o.emailError) : '未寄出')}</p></div>
    </div>
    <div class="table-wrap" style="margin-top:14px"><table class="tbl">
      <thead><tr><th>品項</th><th class="num">數量</th><th class="num">小計</th><th class="num">成本</th><th class="num">毛利</th></tr></thead>
      <tbody>${items}</tbody>
    </table></div>
    <div style="max-width:300px;margin-left:auto;margin-top:14px">
      <div class="row-between"><span class="muted">商品小計</span><span class="mono">${money(o.subtotal)}</span></div>
      <div class="row-between"><span class="muted">運費</span><span class="mono">${o.shipping ? money(o.shipping) : '免運'}</span></div>
      <div class="row-between" style="margin-top:6px;padding-top:6px;border-top:1px solid var(--border)"><span>總額</span><span class="mono" style="color:var(--gold)">${money(o.total)}</span></div>
      <div class="row-between tiny faint" style="margin-top:4px"><span>總成本 ${money(o.totalCost)} · 毛利 ${money(o.profit)}</span></div>
    </div>`, true);
}

/* ===== 系統設定 ===== */
function renderSettings() {
  const s = S.getSettings();
  document.getElementById('tabBody').innerHTML = `
    <div class="grid g2" style="gap:18px;align-items:start">
      <div class="card">
        <h3 class="h-3">店鋪與費用</h3>
        <div class="field" style="margin-top:12px"><label class="label">店鋪名稱</label><input class="input" id="s_shop" value="${App.esc(s.shopName)}"></div>
        <div class="field" style="margin-top:10px"><label class="label">收件 Email（訂單通知發往此）</label><input class="input" id="s_owner" value="${App.esc(s.ownerEmail)}" placeholder="you@example.com"></div>
        <div class="field" style="margin-top:10px"><label class="label">運費 (HK$, 未達免運門檻時)</label><input class="input" id="s_ship" type="number" value="${s.shippingFee}"></div>
        <div class="field" style="margin-top:10px"><label class="label">免運門檻 (HK$)</label><input class="input" id="s_free" type="number" value="${s.freeShipAbove}"></div>
        <div class="field" style="margin-top:10px"><label class="label">稅率 (%)</label><input class="input" id="s_tax" type="number" step="0.1" value="${s.taxRate}"></div>
        <div class="field" style="margin-top:10px"><label class="label">低庫存警示線 (件)</label><input class="input" id="s_low" type="number" value="${s.lowStockAlert}"></div>
      </div>
      <div class="card">
        <h3 class="h-3">Email 通知服務</h3>
        <div class="field" style="margin-top:12px"><label class="label">服務商</label>
          <select class="select" id="s_provider">
            <option value="none" ${s.provider === 'none' ? 'selected' : ''}>尚未設定 (none)</option>
            <option value="web3forms" ${s.provider === 'web3forms' ? 'selected' : ''}>Web3Forms（最簡單,免註冊 API key）</option>
            <option value="formspree" ${s.provider === 'formspree' ? 'selected' : ''}>Formspree</option>
            <option value="emailjs" ${s.provider === 'emailjs' ? 'selected' : ''}>EmailJS</option>
          </select>
        </div>
        <div id="provFields"></div>
        <div class="field" style="margin-top:10px"><label class="row" style="gap:8px;cursor:pointer"><input type="checkbox" id="s_notifyC" ${s.notifyCustomer ? 'checked' : ''}><span class="label" style="margin:0">同時發送確認信給客戶</span></label></div>
      </div>
      <div class="card">
        <h3 class="h-3">管理密碼</h3>
        <div class="field" style="margin-top:12px"><label class="label">目前密碼</label><input class="input" id="s_cur" type="password" placeholder="確認身分"></div>
        <div class="field" style="margin-top:10px"><label class="label">新密碼</label><input class="input" id="s_new" type="password" placeholder="留空則不修改"></div>
      </div>
    </div>
    <div class="row wrap-row" style="gap:10px;margin-top:18px">
      <button class="btn btn-primary" id="s_save">儲存設定</button>
      <button class="btn btn-ghost" id="s_test">發送測試郵件</button>
      <span id="s_msg" class="tiny muted"></span>
    </div>`;
  renderProvFields();
  document.getElementById('s_provider').onchange = renderProvFields;
  document.getElementById('s_save').onclick = saveSettings;
  document.getElementById('s_test').onclick = testEmail;
}
function renderProvFields() {
  const s = S.getSettings();
  const p = document.getElementById('s_provider').value;
  let html = '';
  if (p === 'web3forms') html = `<div class="field" style="margin-top:12px"><label class="label">Web3Forms Access Key</label><input class="input" id="s_w3" value="${App.esc(s.web3forms.accessKey)}" placeholder="從 web3forms.com 取得"></div>`;
  if (p === 'formspree') html = `<div class="field" style="margin-top:12px"><label class="label">Formspree Endpoint URL</label><input class="input" id="s_fs" value="${App.esc(s.formspree.endpoint)}" placeholder="https://formspree.io/f/xxxx"></div>`;
  if (p === 'emailjs') html = `<div class="field" style="margin-top:12px"><label class="label">Service ID</label><input class="input" id="s_ej1" value="${App.esc(s.emailjs.serviceId)}"></div>
    <div class="field" style="margin-top:8px"><label class="label">Template ID</label><input class="input" id="s_ej2" value="${App.esc(s.emailjs.templateId)}"></div>
    <div class="field" style="margin-top:8px"><label class="label">Public Key</label><input class="input" id="s_ej3" value="${App.esc(s.emailjs.publicKey)}"></div>`;
  const box = document.getElementById('provFields');
  if (box) box.innerHTML = html;
}
function saveSettings() {
  const patch = {
    shopName: document.getElementById('s_shop').value,
    ownerEmail: document.getElementById('s_owner').value,
    shippingFee: +document.getElementById('s_ship').value || 0,
    freeShipAbove: +document.getElementById('s_free').value || 0,
    taxRate: +document.getElementById('s_tax').value || 0,
    lowStockAlert: +document.getElementById('s_low').value || 0,
    provider: document.getElementById('s_provider').value,
    notifyCustomer: document.getElementById('s_notifyC').checked,
    web3forms: { accessKey: document.getElementById('s_w3') ? document.getElementById('s_w3').value : S.getSettings().web3forms.accessKey },
    formspree: { endpoint: document.getElementById('s_fs') ? document.getElementById('s_fs').value : S.getSettings().formspree.endpoint },
    emailjs: {
      serviceId: document.getElementById('s_ej1') ? document.getElementById('s_ej1').value : S.getSettings().emailjs.serviceId,
      templateId: document.getElementById('s_ej2') ? document.getElementById('s_ej2').value : S.getSettings().emailjs.templateId,
      publicKey: document.getElementById('s_ej3') ? document.getElementById('s_ej3').value : S.getSettings().emailjs.publicKey
    }
  };
  const cur = document.getElementById('s_cur').value, nw = document.getElementById('s_new').value;
  if (nw) {
    if (cur !== S.getSettings().adminPass) { App.toast('目前密碼不正確', 'err'); return; }
    patch.adminPass = nw;
  }
  S.saveSettings(patch);
  document.getElementById('s_msg').textContent = '設定已儲存 ✓';
  setTimeout(() => document.getElementById('s_msg').textContent = '', 2500);
  renderKpi();
}
async function testEmail() {
  const msg = document.getElementById('s_msg'); msg.textContent = '發送中…';
  const r = await S.sendTestEmail();
  msg.textContent = (r.ok ? '✓ ' : '✗ ') + r.msg;
  App.toast(r.ok ? '測試郵件已寄出' : r.msg, r.ok ? 'ok' : 'err');
}

/* ===== 資料備份 ===== */
function renderBackup() {
  document.getElementById('tabBody').innerHTML = `
    <div class="grid g2" style="gap:18px;align-items:start">
      <div class="card">
        <h3 class="h-3">匯出</h3>
        <p class="tiny muted" style="margin-top:8px">備份全部設定、產品與訂單為 JSON,或匯出 CSV 報表。</p>
        <div class="col" style="gap:10px;margin-top:14px">
          <button class="btn btn-primary btn-sm" id="b_json">匯出全部 (JSON)</button>
          <button class="btn btn-ghost btn-sm" id="b_ocsv">匯出訂單 (CSV)</button>
          <button class="btn btn-ghost btn-sm" id="b_pcsv">匯出產品 (CSV)</button>
        </div>
      </div>
      <div class="card">
        <h3 class="h-3">匯入 / 重置</h3>
        <p class="tiny muted" style="margin-top:8px">從 JSON 還原（會覆蓋現有設定/產品/訂單）。重置會清空所有本機資料並恢復預設產品。</p>
        <div class="col" style="gap:10px;margin-top:14px">
          <label class="btn btn-ghost btn-sm" style="cursor:pointer">選擇 JSON 匯入<input type="file" id="b_file" accept=".json,application/json" style="display:none"></label>
          <button class="btn btn-danger btn-sm" id="b_reset">重置全部資料</button>
        </div>
      </div>
    </div>`;
  document.getElementById('b_json').onclick = () => App.download('crystal-atelier-backup.json', S.exportJSON(), 'application/json');
  document.getElementById('b_ocsv').onclick = () => App.download('orders.csv', S.ordersCSV(), 'text/csv');
  document.getElementById('b_pcsv').onclick = () => App.download('products.csv', S.productsCSV(), 'text/csv');
  document.getElementById('b_file').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { S.importJSON(r.result); App.toast('已匯入', 'ok'); renderAll(); } catch (err) { App.toast('匯入失敗: ' + err.message, 'err'); } };
    r.readAsText(f);
  };
  document.getElementById('b_reset').onclick = () => {
    if (confirm('確定重置?這將清空所有訂單、產品與設定,並恢復預設 46 款產品。')) { S.resetAll(); App.toast('已重置'); renderAll(); }
  };
}
</script>
</body>
