<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>後台管理 · 極晶閣 Auralite</title>
<meta name="description" content="極晶閣後台:產品與庫存管理、訂單與成本毛利分析、Email 設定、資料備份。">
<link rel="stylesheet" href="assets/css/style.css?v=2">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><path d='M20 2 L33 13 L28 34 L12 34 L7 13 Z' fill='%2314b8a6'/></svg>">
</head>
<body>
<header id="nav"></header>

<!-- ===== 登入閘 ===== -->
<div id="gate" class="gate">
  <div class="card gate-card">
    <div class="brand" style="justify-content:center;margin-bottom:18px">🔮<span>極晶閣<span class="brand-sub">ADMIN</span></span></div>
    <h2 class="h-2 center">後台管理登入</h2>
    <div class="field" style="margin-top:20px">
      <label class="label">管理帳號</label>
      <input type="text" class="input" id="loginInput" placeholder="auralite" autocomplete="off">
    </div>
    <div class="field" style="margin-top:12px">
      <label class="label">管理密碼</label>
      <input type="password" class="input" id="passInput" placeholder="••••••••" autocomplete="off">
    </div>
    <button class="btn btn-primary btn-block" id="btnUnlock" style="margin-top:16px">解鎖後台</button>
    <p class="tiny" id="gateErr" style="color:var(--danger);margin-top:10px;display:none">密碼錯誤,請重試。</p>
    <a href="index.html" class="tiny faint" style="display:block;text-align:center;margin-top:16px">← 返回店鋪首頁</a>
  </div>
</div>

<!-- ===== 後台主體 ===== -->
<main id="admin" style="display:none">
  <section class="section-sm">
    <div class="wrap">
      <div class="row-between wrap-row" style="margin-bottom:18px">
        <div>
          <h1 class="h-1">後台總覽</h1>
          <p class="tiny muted">所有數據儲存於本機瀏覽器（localStorage）。</p>
        </div>
        <button class="btn btn-ghost btn-sm" id="btnLock">登出 / 鎖定</button>
      </div>
      <div class="kpi-grid" id="kpiGrid"></div>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="wrap">
      <div class="tabs" id="tabs">
        <button class="tab on" data-tab="products">產品 / 庫存</button>
        <button class="tab" data-tab="services">加購服務</button>
        <button class="tab" data-tab="crystals">晶石可見性</button>
        <button class="tab" data-tab="orders">訂單 / 毛利</button>
        <button class="tab" data-tab="settings">系統設定</button>
        <button class="tab" data-tab="text">頁面文案</button>
        <button class="tab" data-tab="report">八字報告模板</button>
        <button class="tab" data-tab="backup">資料備份</button>
      </div>
      <div id="tabBody"></div>
    </div>
  </section>
</main>

<footer id="footer"></footer>

<!-- 共用 modal -->
<div class="modal-mask" id="modalMask"><div class="modal" id="modalBox"></div></div>

<script src="assets/js/bazi.js?v=2"></script>
<script src="assets/js/data.js?v=2"></script>
<script src="assets/js/store.js?v=2"></script>
<script src="assets/js/i18n.js?v=2"></script>
<script src="assets/js/app.js?v=2"></script>
<script>
App.boot('admin.html');
const S = Store, CD = CrystalData;
let unlocked = false;

/* ===== 登入 ===== */
function tryUnlock() {
  const s = S.getSettings();
  const login = document.getElementById('loginInput').value.trim();
  const v = document.getElementById('passInput').value;
  const loginOk = !s.adminLogin || login === s.adminLogin;
  if (loginOk && v === s.adminPass) {
    unlocked = true;
    document.getElementById('gate').style.display = 'none';
    document.getElementById('admin').style.display = 'block';
    renderAll();
  } else {
    const e = document.getElementById('gateErr');
    e.textContent = loginOk ? '密碼錯誤,請重試。' : '帳號或密碼錯誤,請重試。';
    e.style.display = 'block';
    document.getElementById('passInput').value = '';
  }
}
document.getElementById('loginInput').value = S.getSettings().adminLogin || '';
document.getElementById('btnUnlock').onclick = tryUnlock;
document.getElementById('passInput').addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
document.getElementById('loginInput').addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
document.getElementById('btnLock').onclick = () => { unlocked = false; location.reload(); };

/* ===== 通用 modal ===== */
function openModal(html, wide) {
  const m = document.getElementById('modalMask'), b = document.getElementById('modalBox');
  b.className = 'modal' + (wide ? ' modal-lg' : '');
  b.innerHTML = html + `<div class="row wrap-row" style="gap:8px;margin-top:22px;justify-content:flex-end">
    <button class="btn btn-ghost btn-sm" onclick="closeModal()">關閉</button></div>`;
  m.classList.add('open');
}
window.closeModal = function () { document.getElementById('modalMask').classList.remove('open'); };
document.getElementById('modalMask').onclick = e => { if (e.target.id === 'modalMask') closeModal(); };

/* ===== 工具 ===== */
function money(n) { return 'HK$' + Number(n || 0).toLocaleString('en-US'); }
function margin(p, c) { return p ? ((p - c) / p * 100).toFixed(1) + '%' : '—'; }
function elPill(e) { return `<span class="wx wx-${e}"><span class="dot"></span>${e}</span>`; }
function buildProduct(crystalId, form, spec, price, cost, stock, note, customName) {
  const c = CD.getCrystal(crystalId);
  const fallbackName = customName || c.name || crystalId;
  return {
    id: (customName && c) ? crystalId + '-' + form : crystalId + '-' + form,
    sku: (crystalId.slice(0, 3) + form.slice(0, 2) + (spec || '').replace(/[^0-9]/g, '')).toUpperCase().replace(/[^A-Z0-9]/g, ''),
    crystalId, name: fallbackName, en: c ? c.en : '', element: c ? c.element : '—', colors: c ? c.colors : ['#14b8a6', '#38bdf8', '#0e7490'],
    form, formLabel: CD.FORM_LABEL[form] || form, spec: spec || '',
    price: +price, cost: +cost, stock: +stock, note: note || '',
    chakra: c ? c.chakra : '—', hardness: c ? c.hardness : '—', origin: c ? c.origin : '—', benefits: c ? c.benefits : [],
    active: true,
    img: '',
    custom: !c
  };
}

function openCustomProductModal() {
  openModal(`
    <h2 class="h-3">全新自訂品項</h2>
    <p class="tiny muted" style="margin-top:4px">無需從下拉選單選 — 直接手動填寫即可建立全新項目,系統會自動建立 SKU 與預設資料。</p>
    <div class="grid g2" style="gap:14px;margin-top:14px">
      <div class="field"><label class="label">水晶 ID <span style="color:var(--danger)">*</span></label>
        <input class="input" id="cp_cid" placeholder="例:my-rose-quartz" value="custom-${Date.now().toString(36)}"></div>
      <div class="field"><label class="label">顯示名稱 <span style="color:var(--danger)">*</span></label>
        <input class="input" id="cp_name" placeholder="例:玫瑰石英手鏈"></div>
    </div>
    <div class="grid g2" style="gap:14px;margin-top:12px">
      <div class="field"><label class="label">形態</label>
        <select class="select" id="cp_form">
          ${Object.entries(CD.FORM_LABEL).map(([k, v]) => `<option value="${k}">${App.esc(v)}</option>`).join('')}
        </select></div>
      <div class="field"><label class="label">規格</label>
        <input class="input" id="cp_spec" placeholder="10mm" value="10mm"></div>
    </div>
    <div class="grid g3" style="gap:14px;margin-top:12px">
      <div class="field"><label class="label">售價 (HK$) <span style="color:var(--danger)">*</span></label>
        <input class="input" id="cp_price" type="number" min="0" value="380"></div>
      <div class="field"><label class="label">成本 (HK$)</label>
        <input class="input" id="cp_cost" type="number" min="0" value="120"></div>
      <div class="field"><label class="label">初始庫存</label>
        <input class="input" id="cp_stock" type="number" min="0" value="10"></div>
    </div>
    <div class="field" style="margin-top:12px"><label class="label">備註(五行、產地、顏色、額外說明…)</label>
      <textarea class="textarea" id="cp_note" placeholder="例:五行 木 · 馬達加斯加產 · 粉紅色系"></textarea></div>
    <div class="row wrap-row" style="gap:8px;margin-top:18px;justify-content:flex-end">
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">取消</button>
      <button class="btn btn-primary btn-sm" id="cp_add">加入列表</button>
    </div>`, true);
  document.getElementById('cp_add').onclick = () => {
    const cid = document.getElementById('cp_cid').value.trim();
    const nm = document.getElementById('cp_name').value.trim();
    if (!cid) return App.toast('請填寫水晶 ID', 'err');
    if (!nm) return App.toast('請填寫顯示名稱', 'err');
    if (PB.some(p => p.crystalId === cid && p.form === document.getElementById('cp_form').value && p.spec === document.getElementById('cp_spec').value.trim())) {
      return App.toast('已有相同 ID/形態/規格的品項', 'err');
    }
    PB.push({
      crystalId: cid, form: document.getElementById('cp_form').value, spec: document.getElementById('cp_spec').value.trim(),
      name: nm, price: +document.getElementById('cp_price').value || 0,
      cost: +document.getElementById('cp_cost').value || 0, stock: +document.getElementById('cp_stock').value || 0,
      note: document.getElementById('cp_note').value.trim(), img: ''
    });
    closeModal();
    drawProducts();
    App.toast('已加入列表 · 按「儲存全部變更」生效', 'ok');
  };
}

/* ===== KPI ===== */
function renderKpi() {
  const s = S.stats();
  const cards = [
    { v: money(s.revenue), l: '總營收', c: 'var(--gold)' },
    { v: money(s.profit), l: '總毛利 (' + s.margin + '%)', c: '#4ade80' },
    { v: money(s.inventoryValue), l: '庫存成本價值', c: 'var(--accent)' },
    { v: s.lowStock.length + s.outStock.length, l: '低/缺貨品項', c: '#fb7185' }
  ];
  document.getElementById('kpiGrid').innerHTML = cards.map(k => `
    <div class="card kpi"><div class="kpi-v" style="color:${k.c}">${k.v}</div><div class="kpi-l">${k.l}</div></div>`).join('');
}

/* ===== Tabs ===== */
function renderAll() { renderKpi(); switchTab(curTab); }
let curTab = 'products';
function switchTab(t) {
  curTab = t;
  document.querySelectorAll('#tabs .tab').forEach(x => x.classList.toggle('on', x.dataset.tab === t));
  ({ products: renderProducts, services: renderServices, crystals: renderCrystals, orders: renderOrders, settings: renderSettings, text: renderTextEditor, report: renderReport, backup: renderBackup }[t])();
}
document.querySelectorAll('#tabs .tab').forEach(b => b.onclick = () => switchTab(b.dataset.tab));

/* ===== 產品管理 ===== */
let PB = [];
const _cList = CD.CRYSTALS.map(c => ({ v: c.id, t: c.name + '（' + c.element + '）' }));
const _fList = Object.entries(CD.FORM_LABEL).map(([k, v]) => ({ v: k, t: v }));
function _opts(list, val) { return list.map(o => `<option value="${o.v}" ${o.v === val ? 'selected' : ''}>${o.t}</option>`).join(''); }

function renderProducts() {
  PB = S.getProducts().map(p => Object.assign({}, p));
  drawProducts();
}

function drawProducts() {
  const rows = PB.map((p, idx) => {
    const sc = +p.stock === 0 ? 'color:var(--danger)' : (+p.stock <= S.getSettings().lowStockAlert ? 'color:var(--warn)' : '');
    const isCustom = !CD.CRYSTALS.find(c => c.id === p.crystalId);
    return `<tr data-idx="${idx}">
      <td><input class="cell-in" data-f="crystalId" value="${App.esc(p.crystalId)}" placeholder="crystal-id" list="crystalList"${isCustom ? ' style="color:var(--accent-2);font-weight:600"' : ''}></td>
      <td><input class="cell-in" data-f="form" value="${App.esc(p.form || '')}" placeholder="bracelet" list="formList"></td>
      <td><input class="cell-in" data-f="spec" value="${App.esc(p.spec || '')}" placeholder="10mm"></td>
      <td><input class="cell-in" data-f="name" value="${App.esc(p.name || '')}" placeholder="顯示名稱"></td>
      <td><input class="cell-num" type="number" min="0" data-f="price" value="${p.price}"></td>
      <td><input class="cell-num" type="number" min="0" data-f="cost" value="${p.cost}"></td>
      <td style="${sc}"><input class="cell-num sm" type="number" min="0" data-f="stock" value="${p.stock}"></td>
      <td class="num tiny faint" data-m="${idx}">${margin(p.price, p.cost)}</td>
      <td class="tiny"><button class="btn btn-ghost btn-xs" data-img="${idx}">設圖</button>${p.img ? ' ✓' : ''}</td>
      <td class="row" style="gap:5px;justify-content:flex-end;flex-wrap:nowrap">
        <button class="btn btn-ghost btn-xs" data-up="${idx}" title="上移一列"${idx === 0 ? ' disabled style="opacity:.4;cursor:not-allowed"' : ''}>↑</button>
        <button class="btn btn-ghost btn-xs" data-down="${idx}" title="下移一列"${idx === PB.length - 1 ? ' disabled style="opacity:.4;cursor:not-allowed"' : ''}>↓</button>
        <button class="btn btn-danger btn-xs" data-del="${idx}">刪除</button>
      </td>
    </tr>`;
  }).join('');
  document.getElementById('tabBody').innerHTML = `
    <datalist id="crystalList">${CD.CRYSTALS.map(c => `<option value="${c.id}">${App.esc(c.name)}（${c.element}）</option>`).join('')}</datalist>
    <datalist id="formList">${Object.entries(CD.FORM_LABEL).map(([k, v]) => `<option value="${k}">${App.esc(v)}</option>`).join('')}</datalist>
    <div class="row-between wrap-row" style="margin-bottom:14px">
      <div class="tiny muted">共 ${PB.length} 項產品 · 可直接於下表編輯,改完按「儲存全部變更」。<br>
        <span style="color:var(--accent-2);font-weight:600">手打水晶 ID</span>(非下拉選單)即可建立全新項目,例:<code>my-rose-quartz</code>。</div>
      <div class="row wrap-row" style="gap:8px">
        <button class="btn btn-ghost btn-sm" id="btnAddCustom">＋ 全新自訂品項</button>
        <button class="btn btn-ghost btn-sm" id="btnAddRow">＋ 新增一列</button>
        <button class="btn btn-primary btn-sm" id="btnSaveProd">儲存全部變更</button>
      </div>
    </div>
    <div class="table-wrap"><table class="tbl">
      <thead><tr><th>水晶 ID</th><th>形態</th><th>規格</th><th>名稱</th><th class="num">售價</th><th class="num">成本</th><th class="num">庫存</th><th class="num">毛利%</th><th>圖</th><th></th></tr></thead>
      <tbody id="prodBody">${rows}</tbody>
    </table></div>`;

  document.getElementById('btnAddRow').onclick = () => {
    PB.push({ crystalId: CD.CRYSTALS[0].id, form: 'bracelet', spec: '', name: '', price: 0, cost: 0, stock: 0, note: '', img: '' });
    drawProducts();
    /* 新增空白列立即保存,客戶頁同步可見(雖然欄位空會被 buildProduct 擋) */
    flushProductsDebounced(true);
  };
  document.getElementById('btnAddCustom').onclick = openCustomProductModal;
  document.getElementById('btnSaveProd').onclick = saveProductsAll;

  const body = document.getElementById('prodBody');
  body.addEventListener('input', e => {
    const tr = e.target.closest('tr'); if (!tr) return;
    const idx = +tr.dataset.idx; const f = e.target.dataset.f; if (!f) return;
    let v = e.target.value;
    if (f === 'price' || f === 'cost' || f === 'stock') v = Math.max(0, Math.floor(+v || 0));
    PB[idx][f] = v;
    if (f === 'price' || f === 'cost') { const cell = body.querySelector('[data-m="' + idx + '"]'); if (cell) cell.textContent = margin(PB[idx].price, PB[idx].cost); }
    /* debounce 500ms 後自動儲存到 Store(避免每按鍵寫入) */
    flushProductsDebounced();
  });
  body.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { PB.splice(+b.dataset.del, 1); drawProducts(); });
  body.querySelectorAll('[data-img]').forEach(b => b.onclick = () => openRowImageModal(+b.dataset.img));
  body.querySelectorAll('[data-up]').forEach(b => b.onclick = () => { const i = +b.dataset.up; if (i > 0) { [PB[i-1], PB[i]] = [PB[i], PB[i-1]]; drawProducts(); } });
  body.querySelectorAll('[data-down]').forEach(b => b.onclick = () => { const i = +b.dataset.down; if (i < PB.length - 1) { [PB[i], PB[i+1]] = [PB[i+1], PB[i]]; drawProducts(); } });
}

function saveProductsAll() {
  const ids = new Set();
  for (const p of PB) {
    const price = Math.max(0, +p.price || 0), cost = Math.max(0, +p.cost || 0), stock = Math.max(0, +p.stock || 0);
    if (!p.crystalId || !p.crystalId.trim()) { App.toast('有商品未填寫水晶 ID', 'err'); return; }
    if (price <= 0) { App.toast('有商品售價為 0,請先填寫售價', 'err'); return; }
    const np = buildProduct(p.crystalId.trim(), p.form, p.spec, price, cost, stock, p.note, (p.name || '').trim() || null);
    np.img = p.img || '';
    np.id = p.id || np.id;
    if (ids.has(np.id)) { App.toast('SKU 重複:' + np.id, 'err'); return; }
    ids.add(np.id);
    p._built = np;
  }
  // 直接以 PB 順序寫回整個陣列(保留使用者調整過的次序),不會被 upsert 的 push-to-end 改動
  S.saveProducts(PB.map(p => p._built));
  App.toast('已儲存全部變更', 'ok');
  renderProducts(); renderKpi();
}

/* 表格編輯的 debounced 自動保存(不擋錯誤,默默寫入,讓客戶頁即時同步)
   onlyFull=true 表示只在「欄位齊全」時寫(用於新增空白列後避免寫出空資料) */
let _flushTimer = null;
function flushProductsDebounced(onlyFull) {
  clearTimeout(_flushTimer);
  _flushTimer = setTimeout(() => {
    const built = [];
    for (const p of PB) {
      if (onlyFull) {
        if (!p.crystalId || !p.crystalId.trim()) continue;
        if ((+p.price || 0) <= 0) continue;
      }
      try {
        const np = buildProduct(p.crystalId || CD.CRYSTALS[0].id, p.form || 'bracelet', p.spec || '', Math.max(0, +p.price || 0), Math.max(0, +p.cost || 0), Math.max(0, +p.stock || 0), p.note || '', (p.name || '').trim() || null);
        np.img = p.img || '';
        np.id = p.id || np.id;
        built.push(np);
      } catch (e) { /* 欄位未完整,略過 */ }
    }
    if (built.length) S.saveProducts(built);
  }, onlyFull ? 0 : 500);
}

function openRowImageModal(idx) {
  const p = PB[idx];
  openModal(`
    <h2 class="h-3">設定產品圖片</h2>
    <div class="img-edit" style="margin-top:14px">
      <div class="img-prev" id="ri_prev" style="cursor:zoom-in" title="點擊放大查看完整圖片">${p.img ? `<img src="${App.esc(p.img)}" alt="">` : '<span class="tiny muted">尚無圖片</span>'}</div>
      <div class="img-tools">
        <input type="file" id="ri_file" accept="image/*" class="input">
        <input class="input" id="ri_url" value="${p.img && p.img.indexOf('data:') !== 0 ? App.esc(p.img) : ''}" placeholder="或貼圖片網址 / 路徑">
        <div class="tiny muted">建議原圖白底;上傳後自動壓成 800px。<b>點上方圖片可放大預覽</b>。</div>
      </div>
    </div>
    <div class="row wrap-row" style="gap:8px;margin-top:16px;justify-content:flex-end">
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">取消</button>
      <button class="btn btn-primary btn-sm" id="ri_ok">確定</button>
    </div>`, true);
  let pending = null;
  /* 點圖片放大燈箱 */
  function bindPrevLightbox() {
    const prev = document.getElementById('ri_prev');
    if (!prev) return;
    const im = prev.querySelector('img');
    if (im) im.style.cursor = 'zoom-in';
    prev.onclick = (e) => {
      const im2 = prev.querySelector('img');
      if (!im2) return;
      e.stopPropagation();
      const src = im2.src;
      if (src) App.openImageLightbox(src, p.name || '產品圖預覽');
    };
  }
  bindPrevLightbox();
  document.getElementById('ri_file').onchange = ev => {
    const f = ev.target.files && ev.target.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = e => {
      const im = new Image();
      im.onload = () => {
        const max = 800, scale = Math.min(1, max / Math.max(im.width, im.height));
        const w = Math.max(1, Math.round(im.width * scale)), h = Math.max(1, Math.round(im.height * scale));
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        const cx = cv.getContext('2d'); cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, w, h); cx.drawImage(im, 0, 0, w, h);
        pending = cv.toDataURL('image/jpeg', 0.82);
        document.getElementById('ri_prev').innerHTML = `<img src="${pending}" alt="">`;
        document.getElementById('ri_url').value = '';
        bindPrevLightbox();
      };
      im.src = e.target.result;
    };
    reader.readAsDataURL(f);
  };
  document.getElementById('ri_url').oninput = ev => {
    const u = ev.target.value.trim();
    pending = null;
    document.getElementById('ri_prev').innerHTML = u ? `<img src="${u}" alt="">` : '<span class="tiny muted">尚無圖片</span>';
    bindPrevLightbox();
  };
  document.getElementById('ri_ok').onclick = () => {
    const u = document.getElementById('ri_url').value.trim();
    PB[idx].img = pending || u || p.img || '';
    closeModal(); drawProducts();
    /* 即時寫入 Store(圖片立刻在客戶頁生效,不必等「儲存全部變更」) */

let SB = [];
function renderServices() {
  SB = Store.getServices().map(s => Object.assign({}, s));

function drawServices() {
  const rows = SB.map((s, idx) => `
    <tr data-idx="${idx}">
      <td><input class="cell-in" data-f="id" value="${App.esc(s.id)}" placeholder="svc-xxx"></td>
      <td><input class="cell-in" data-f="name" value="${App.esc(s.name)}" placeholder="名稱"></td>
      <td><input class="cell-in" data-f="en" value="${App.esc(s.en || '')}" placeholder="English"></td>
      <td><input class="cell-num" type="number" min="0" data-f="price" value="${s.price}"></td>
      <td><input class="cell-num" type="number" min="0" data-f="cost" value="${s.cost}"></td>
      <td><input class="cell-in" style="width:46px;text-align:center" data-f="icon" value="${App.esc(s.icon || '')}" placeholder="☯"></td>
      <td><input class="cell-in" data-f="desc" value="${App.esc(s.desc || '')}" placeholder="說明"></td>
      <td class="row" style="gap:5px;justify-content:flex-end;flex-wrap:nowrap">
        <button class="btn btn-ghost btn-xs" data-svc-up="${idx}" title="上移一列"${idx === 0 ? ' disabled style="opacity:.4;cursor:not-allowed"' : ''}>↑</button>
        <button class="btn btn-ghost btn-xs" data-svc-down="${idx}" title="下移一列"${idx === SB.length - 1 ? ' disabled style="opacity:.4;cursor:not-allowed"' : ''}>↓</button>
        <button class="btn btn-danger btn-xs" data-del="${idx}">刪除</button>
      </td>
    </tr>`).join('');
  document.getElementById('tabBody').innerHTML = `
    <div class="tiny muted" style="margin-bottom:14px">共 ${SB.length} 項加購服務 · 可直接編輯,改完按「儲存全部變更」。此處服務會出現在選購頁與八字頁的「加購定制服務」區。</div>
    <div class="row wrap-row" style="gap:8px;margin-bottom:14px">
      <button class="btn btn-ghost btn-sm" id="btnAddSvc">＋ 新增服務</button>
      <button class="btn btn-primary btn-sm" id="btnSaveSvc">儲存全部變更</button>
    </div>
    <div class="table-wrap"><table class="tbl">
      <thead><tr><th>ID</th><th>名稱</th><th>英文</th><th class="num">售價</th><th class="num">成本</th><th>圖標</th><th>說明</th><th></th></tr></thead>
      <tbody id="svcBody">${rows}</tbody>
    </table></div>`;
  document.getElementById('btnAddSvc').onclick = () => { SB.push({ id: 'svc-' + (Date.now() + '').slice(-6), name: '新服務', en: 'New Service', price: 0, cost: 0, icon: '✦', desc: '' }); drawServices(); };
  document.getElementById('btnSaveSvc').onclick = saveServicesAll;
  const body = document.getElementById('svcBody');
  body.addEventListener('input', e => {
    const tr = e.target.closest('tr'); if (!tr) return;
    const idx = +tr.dataset.idx; const f = e.target.dataset.f; if (!f) return;
    let v = e.target.value;
    if (f === 'price' || f === 'cost') v = Math.max(0, Math.floor(+v || 0));
    SB[idx][f] = v;
  });
  body.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { SB.splice(+b.dataset.del, 1); drawServices(); });
  body.querySelectorAll('[data-svc-up]').forEach(b => b.onclick = () => { const i = +b.dataset.svcUp; if (i > 0) { [SB[i-1], SB[i]] = [SB[i], SB[i-1]]; drawServices(); } });
  body.querySelectorAll('[data-svc-down]').forEach(b => b.onclick = () => { const i = +b.dataset.svcDown; if (i < SB.length - 1) { [SB[i], SB[i+1]] = [SB[i+1], SB[i]]; drawServices(); } });
}
function saveServicesAll() {
  const ids = new Set();
  for (const s of SB) {
    if (!s.id || !s.id.trim()) { App.toast('有服務 ID 空白', 'err'); return; }
    if (!s.name || !s.name.trim()) { App.toast('有服務名稱空白', 'err'); return; }
    if (ids.has(s.id)) { App.toast('服務 ID 重複:' + s.id, 'err'); return; }
    ids.add(s.id);
    s.id = s.id.trim(); s.name = (s.name || '').trim(); s.en = (s.en || '').trim();
    s.desc = (s.desc || '').trim(); s.icon = (s.icon || '').trim() || '✦';
    s.price = Math.max(0, +s.price || 0); s.cost = Math.max(0, +s.cost || 0);
  }
  Store.saveServices(SB.map(s => Object.assign({}, s)));
  App.toast('已儲存加購服務', 'ok');
  renderServices();
}

      const rows = ovItems.map((it, idx) => `<tr>
        <td>${App.esc(it.name)}${it.spec ? ' ' + App.esc(it.spec) : ''}${it.element !== '—' ? ' · ' + App.esc(it.element) : ''}${it.kind === 'custom' ? ' <span class="tiny faint">(自訂)</span>' : ''}</td>
        <td class="num"><input class="input ov-qty" data-i="${idx}" type="number" min="0" value="${it.qty}" style="width:64px"></td>
        <td class="num"><input class="input ov-price" data-i="${idx}" type="number" min="0" value="${it.price}" style="width:92px"></td>
        <td class="num">${App.money(it.qty * it.price)}</td>
        <td class="num">${App.money(it.qty * (it.cost || 0))}</td>
        <td class="num">${App.money(it.qty * it.price - it.qty * (it.cost || 0))}</td>
        <td class="num"><button class="btn btn-danger btn-sm ov-del" data-i="${idx}">✕</button></td>
      </tr>`).join('');
      document.getElementById('ov_items_wrap').innerHTML = `<div class="table-wrap"><table class="tbl">
        <thead><tr><th>品項</th><th class="num">數量</th><th class="num">單價</th><th class="num">小計</th><th class="num">成本</th><th class="num">毛利</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
      document.querySelectorAll('#ov_items_wrap .ov-qty').forEach(inp => inp.onchange = () => { const i = +inp.dataset.i; ovItems[i].qty = Math.max(0, Math.floor(+inp.value) || 0); renderOvItems(); });
      document.querySelectorAll('#ov_items_wrap .ov-price').forEach(inp => inp.onchange = () => { const i = +inp.dataset.i; ovItems[i].price = Math.max(0, +inp.value || 0); renderOvItems(); });
      document.querySelectorAll('#ov_items_wrap .ov-del').forEach(b => b.onclick = () => { ovItems.splice(+b.dataset.i, 1); renderOvItems(); });
    }
    const fin = S.recalcOrder(ovItems);
    document.getElementById('ov_totals').innerHTML = `
      <div class="row-between"><span class="muted">商品小計</span><span class="mono">${App.money(fin.subtotal)}</span></div>
      <div class="row-between"><span class="muted">運費</span><span class="mono">${fin.shipping ? App.money(fin.shipping) : '免運'}</span></div>
      <div class="row-between" style="margin-top:6px;padding-top:6px;border-top:1px solid var(--border)"><span>總額</span><span class="mono" style="color:var(--gold)">${App.money(fin.total)}</span></div>
      <div class="row-between tiny faint" style="margin-top:4px"><span>總成本 ${App.money(fin.totalCost)} · 毛利 ${App.money(fin.profit)} · 毛利率 ${fin.margin}%</span></div>`;
  }
  renderOvItems();

  document.getElementById('ov_addBtn').onclick = () => {
    const v = document.getElementById('ov_addSel').value;
    if (!v) return App.toast('請先選擇產品或服務', 'err');
    const kind = v[0], id = v.slice(2);
    const src = kind === 's' ? S.getServices().find(x => x.id === id) : S.getProducts().find(x => x.id === id);
    if (!src) return;
    const qty = Math.max(1, Math.floor(+document.getElementById('ov_addQty').value) || 1);
    ovItems.push({ id, kind: kind === 's' ? 'service' : 'product', name: src.name, spec: src.spec || '', formLabel: src.formLabel || '', element: src.element || '—', qty, price: src.price, cost: src.cost || 0, lineTotal: src.price * qty, lineCost: (src.cost || 0) * qty });
    renderOvItems();
    App.toast('已加入:' + src.name, 'ok');
  };
  document.getElementById('ov_addCustom').onclick = () => { document.getElementById('ov_customWrap').style.display = 'flex'; };
  document.getElementById('ov_cCancel').onclick = () => { document.getElementById('ov_customWrap').style.display = 'none'; };
  document.getElementById('ov_cAdd').onclick = () => {
    const name = document.getElementById('ov_cName').value.trim();
    const price = Math.max(0, +document.getElementById('ov_cPrice').value || 0);
    const qty = Math.max(1, Math.floor(+document.getElementById('ov_cQty').value) || 1);
    if (!name) return App.toast('請填寫項目名稱', 'err');
    ovItems.push({ id: 'custom-' + Date.now(), kind: 'custom', name, spec: '', formLabel: '自訂', element: '—', qty, price, cost: 0, lineTotal: price * qty, lineCost: 0 });
    renderOvItems();
    document.getElementById('ov_cName').value = ''; document.getElementById('ov_cPrice').value = '';
    document.getElementById('ov_customWrap').style.display = 'none';
    App.toast('已加入自訂項目', 'ok');
  };
  document.getElementById('ov_saveItems').onclick = () => {
    const fin = S.recalcOrder(ovItems);
    S.updateOrder(no, Object.assign({}, fin, { items: ovItems }));
    document.getElementById('ov_itemsMsg').textContent = '已儲存 ✓';
    setTimeout(() => document.getElementById('ov_itemsMsg').textContent = '', 2000);
    renderOrders(); renderKpi(); App.toast('訂單項目已更新', 'ok');
  };

  /* ---- 八字筆記(原邏輯保留) ---- */
  if (hasConsult) {
    const ta = document.getElementById('ov_bazi');
    document.getElementById('ov_saveBazi').onclick = () => {
      S.updateOrder(no, { baziReportNotes: ta.value });
      document.getElementById('ov_baziMsg').textContent = '已儲存 ✓';
      setTimeout(() => document.getElementById('ov_baziMsg').textContent = '', 2000);
    };
    document.getElementById('ov_default').onclick = () => {
      const def = (S.getSettings().baziNotes || '').trim();
      ta.value = def ? def + (ta.value ? '\n\n— — —\n' + ta.value : '') : ta.value;
      App.toast('已套用預設筆記,可再編輯', 'ok');
    };
    document.getElementById('ov_sendBazi').onclick = async () => {
      if (!confirm('確定寄送八字報告給 ' + (S.getOrder(no).customer.name) + '?\n若服務僅能寄往店主(Web3Forms / Formspree),會將內容寄到您的信箱,再由您轉發。')) return;
      S.updateOrder(no, { baziReportNotes: ta.value });
      const btn = document.getElementById('ov_sendBazi'); btn.disabled = true; btn.textContent = '寄送中…';
      const r = await S.sendCustomerEmail(S.getOrder(no));
      btn.disabled = false; btn.textContent = '寄送報告 Email 給客戶';
      const m = document.getElementById('ov_baziMsg');
      m.textContent = (r.ok ? '✓ ' : '✗ ') + r.msg;
      m.style.color = r.ok ? 'var(--pos)' : 'var(--danger)';
      if (r.ok) {
        S.updateOrder(no, { status: 'PDF', customerEmailSent: true, customerEmailProvider: r.provider, customerEmailError: null });
        App.toast('報告已寄出(經 ' + r.provider + '),狀態更新為 PDF', 'ok');
        renderOrders(); viewOrder(no);
      } else {
        S.updateOrder(no, { customerEmailSent: false, customerEmailError: r.msg, customerEmailProvider: r.provider || null });
        App.toast('寄送失敗:' + r.msg, 'err', 5000);
        renderOrders(); viewOrder(no);
      }
    };
  }

  /* ---- 手動轉寄 (mailto + 複製內容) ---- */
  /* 主旨/內容直接用店主在後台編輯的模板,展開 {{order_no}} 等變數 */
  const mailBtn = document.getElementById('ov_mailto');
  if (mailBtn) mailBtn.onclick = () => {
    const ord = S.getOrder(no);
    if (!ord.customer.email) return App.toast('此訂單無客戶 Email', 'err');
    const tpl = (S.getSettings().emailTemplates && S.getSettings().emailTemplates.customerReport) || {};
    const itemsStr = (ord.items || []).map(it => '· ' + it.name + (it.spec ? ' ' + it.spec : '') + ' ×' + it.qty).join('\n');
    const vars = {
      order_no: ord.no, customer_name: ord.customer.name,
      customer_phone: ord.customer.phone || '',
      customer_email: ord.customer.email || '',
      total: 'HK$' + (ord.total || 0).toLocaleString(),
      items: itemsStr, shop_name: S.getSettings().shopName || '極晶閣'
    };
    /* 簡單 {{var}} 展開(避免依賴 store 的內部 expandVars) */
    const expand = (s) => String(s || '').replace(/\{\{\s*(\w+)\s*\}\}/g, (m, k) => (k in vars ? vars[k] : m));
    const subject = encodeURIComponent(expand(tpl.subject || ('【訂單確認】' + ord.no)));
    const body = encodeURIComponent(expand(tpl.body || S.orderTextForCustomer(ord)));
    window.location.href = 'mailto:' + encodeURIComponent(ord.customer.email) + '?subject=' + subject + '&body=' + body;
  };
  const copyBtn = document.getElementById('ov_copyForCust');
  if (copyBtn) copyBtn.onclick = () => {
    const ord = S.getOrder(no);
    const tpl = (S.getSettings().emailTemplates && S.getSettings().emailTemplates.customerReport) || {};
    const itemsStr = (ord.items || []).map(it => '· ' + it.name + (it.spec ? ' ' + it.spec : '') + ' ×' + it.qty).join('\n');
    const vars = {
      order_no: ord.no, customer_name: ord.customer.name,
      customer_phone: ord.customer.phone || '',
      customer_email: ord.customer.email || '',
      total: 'HK$' + (ord.total || 0).toLocaleString(),
      items: itemsStr, shop_name: S.getSettings().shopName || '極晶閣'
    };
    const expand = (s) => String(s || '').replace(/\{\{\s*(\w+)\s*\}\}/g, (m, k) => (k in vars ? vars[k] : m));
    const full = '【主旨】' + expand(tpl.subject || ('【訂單確認】' + ord.no)) +
      '\n\n' + (expand(tpl.body || S.orderTextForCustomer(ord)));
    App.copyText(full).then(() => App.toast('已複製信件文字,請貼到您的 Email 寄出', 'ok'));
  };

  /* ---- PDF 附件 ---- */
  function renderPdfInfo() {
    const ord = S.getOrder(no);
    const p = ord.pdf;
    const el = document.getElementById('ov_pdfInfo');
    if (!p) { el.innerHTML = '<p class="tiny faint">尚無附件。</p>'; return; }
    const sizeKb = Math.round((p.size || 0) / 1024);
    el.innerHTML = `<div class="row wrap-row" style="gap:10px;align-items:center">
      <span class="status-badge" style="background:#ede9fe;color:#6d28d9">📄 ${App.esc(p.name)} (${sizeKb} KB)</span>
      <button class="btn btn-ghost btn-sm" id="ov_pdfView">預覽</button>
      <a class="btn btn-ghost btn-sm" id="ov_pdfDl" href="${p.data}" download="${App.esc(p.name)}">下載</a>
      <button class="btn btn-danger btn-sm" id="ov_pdfDel">移除</button>
    </div>`;
    document.getElementById('ov_pdfView').onclick = () => window.open(p.data, '_blank');
    document.getElementById('ov_pdfDel').onclick = () => { if (confirm('移除附件?')) { S.updateOrder(no, { pdf: null }); renderPdfInfo(); App.toast('已移除附件'); } };
  }
  renderPdfInfo();
  document.getElementById('ov_pdfUp').onclick = () => {
    const f = document.getElementById('ov_pdf').files[0];
    if (!f) return App.toast('請選擇 PDF 檔', 'err');
    if (f.type !== 'application/pdf' && !f.name.toLowerCase().endsWith('.pdf')) return App.toast('只接受 PDF 檔', 'err');
    if (f.size > 4 * 1024 * 1024) return App.toast('檔案過大（>4MB）,請壓縮後再上傳', 'err');
    const r = new FileReader();
    r.onload = () => { S.updateOrder(no, { pdf: { name: f.name, data: r.result, size: f.size } }); renderPdfInfo(); App.toast('PDF 已上傳並儲存', 'ok'); };
    r.readAsDataURL(f);
  };
  document.getElementById('ov_emailPdf').onclick = async () => {
    if (!confirm('確定寄出訂單明細 + PDF 給客戶?\n注意:Web3Forms / Formspree 僅能寄往店主信箱,請將信件轉發給客戶。')) return;
    const btn = document.getElementById('ov_emailPdf'); btn.disabled = true; btn.textContent = '寄送中…';
    const r = await S.emailOrderBundle(S.getOrder(no));
    btn.disabled = false; btn.textContent = '📧 寄出訂單明細 + PDF 給客戶';
    const m = document.getElementById('ov_emailMsg');
    m.textContent = (r.ok ? '✓ ' : '✗ ') + r.msg;
    m.style.color = r.ok ? 'var(--pos)' : 'var(--danger)';
    if (r.ok) {
      S.updateOrder(no, { status: 'PDF', customerEmailSent: true, customerEmailProvider: r.provider, customerEmailError: null });
      App.toast('已寄出(經 ' + r.provider + '),請轉發給客戶', 'ok');
      renderOrders(); viewOrder(no);
    } else {
      S.updateOrder(no, { customerEmailSent: false, customerEmailError: r.msg, customerEmailProvider: r.provider || null });
      App.toast('寄送失敗:' + r.msg, 'err', 5000);
      renderOrders(); viewOrder(no);
    }
  };
}

/* ===== 頁面文案管理 ===== */
function renderTextEditor() {
  const all = S.getAllText();
  const keys = Object.keys(all).sort();
  /* 計算每個 key 出現在哪些頁面(掃描 HTML 與 JS 內字串模板) */
  const pages = ['index.html', 'shop.html', 'bazi.html', 'checkout.html', 'orders.html', 'knowledge.html'];
  function findIn(key) {
    const pat = new RegExp(key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    const hits = [];
    pages.forEach(p => {
      try {
        const xhr = new XMLHttpRequest(); xhr.open('GET', p, false); xhr.send(null);
        if (xhr.status === 200 && pat.test(xhr.responseText)) hits.push(p);
      } catch (e) {}
    });
    return hits;
  }
  const rows = keys.map(k => {
    const e = all[k];
    const builtinBadge = e._builtin ? '<span class="tiny" style="background:#dbeafe;color:#1d4ed8;padding:1px 6px;border-radius:4px;margin-left:4px">預設</span>' : '<span class="tiny" style="background:#fef3c7;color:#92400e;padding:1px 6px;border-radius:4px;margin-left:4px">自訂</span>';
    const hits = findIn(k);
    const usage = hits.length ? `<span class="tiny faint">→ ${hits.join(', ')}</span>` : `<span class="tiny faint">(尚未引用 — 需用 <code>data-t="${App.esc(k)}"</code> 或 <code>App.T('${App.esc(k)}', ...)</code> 呼叫)</span>`;
    return `<tr data-key="${App.esc(k)}">
      <td style="min-width:170px"><code class="tiny">${App.esc(k)}</code>${builtinBadge}<div class="tiny faint" style="margin-top:3px">${usage}</div></td>
      <td><textarea class="cell-in" data-f="zh" rows="2" placeholder="中文">${App.esc(e.zh || '')}</textarea></td>
      <td><textarea class="cell-in" data-f="en" rows="2" placeholder="English">${App.esc(e.en || '')}</textarea></td>
      <td class="row" style="gap:5px;justify-content:flex-end;flex-wrap:wrap"><button class="btn btn-ghost btn-xs" data-act="save">儲存</button><button class="btn btn-ghost btn-xs" data-act="preview" title="即時預覽客戶頁的呈現">預覽</button><button class="btn btn-danger btn-xs" data-act="del"${e._builtin ? '' : ' title="刪除此自訂文案"'}>${e._builtin ? '↺ 還原預設' : '刪除'}</button></td>
    </tr>`;
  }).join('');
  document.getElementById('tabBody').innerHTML = `
    <div class="card">
      <div class="row-between wrap-row" style="margin-bottom:14px">
        <div>
          <h3 class="h-3">頁面文案</h3>
          <p class="tiny muted">編輯客戶頁(index / shop / bazi / checkout / orders / knowledge)的標題、副標題、按鈕等文字。<b>改完按「儲存」立即生效</b>,可分頁切換客戶頁查看,或在按「預覽」用新分頁開啟首頁。</p>
        </div>
        <button class="btn btn-primary btn-sm" id="btnAddTextKey">＋ 新增文案</button>
      </div>
      <div class="note" style="margin-bottom:14px"><span>💡</span><div>
        使用方式:在頁面 HTML 內以 <code>&lt;h1 data-t="hero.title"&gt;原文字&lt;/h1&gt;</code> 標記;JS 內用 <code>App.T('key', '中文預設', 'English default')</code>。客戶頁切換語言時自動套對應版本。<br>
        <b>預設</b> 標籤是系統內建(可改但建議保留);<b>自訂</b> 是您新增的;刪除自訂會連同 key 一起移除。<br>
        <span style="color:var(--pos)">● 已引用</span>表示此 key 已被頁面或程式使用,改了會即時看到;<span style="color:var(--warn)">● 未引用</span>表示還沒有對應的 data-t/App.T 呼叫,需先在頁面加掛後才會顯示。
      </div></div>
      <div style="overflow-x:auto">
        <table class="tbl" id="textTbl" style="min-width:840px">
          <thead><tr><th>Key</th><th>中文</th><th>English</th><th style="width:200px">操作</th></tr></thead>
          <tbody id="textTblBody">${rows}</tbody>
        </table>
      </div>
    </div>
  `;
  const body = document.getElementById('textTblBody');
  body.querySelectorAll('tr').forEach(tr => {
    const key = tr.dataset.key;
    tr.querySelectorAll('[data-f]').forEach(ta => {
      ta.addEventListener('input', e => {
        const all = S.getAllText();
        const cur = all[key] || { zh: '', en: '' };
        cur[ta.dataset.f] = ta.value;
      });
    });
    tr.querySelector('[data-act="save"]').onclick = () => {
      const zh = (tr.querySelector('[data-f="zh"]').value || '').trim();
      const en = (tr.querySelector('[data-f="en"]').value || '').trim();
      S.setText({ [key]: { zh, en } });
      App.toast('已儲存 ' + key + ' · 客戶頁立即生效', 'ok');
      renderTextEditor();
    };
    tr.querySelector('[data-act="preview"]').onclick = () => {
      const zh = (tr.querySelector('[data-f="zh"]').value || '').trim();
      const en = (tr.querySelector('[data-f="en"]').value || '').trim();
      S.setText({ [key]: { zh, en } });
      window.open('index.html?t=' + Date.now(), '_blank');
    };
    tr.querySelector('[data-act="del"]').onclick = () => {
      const e = S.getAllText()[key];
      if (!confirm(e._builtin ? '確定將 ' + key + ' 還原為系統預設?' : '確定刪除自訂文案 ' + key + '?')) return;
      if (e._builtin) S.setText({ [key]: { zh: '', en: '' } }); // 還原預設
      else S.deleteTextKey(key);
      App.toast(e._builtin ? '已還原預設' : '已刪除', 'ok');
      renderTextEditor();
    };
  });
  document.getElementById('btnAddTextKey').onclick = () => {
    const key = prompt('新文案 key(英文 + 點分隔,例:shop.banner)\n只能用英文、數字、點、底線,首字需英文字母:');
    if (!key) return;
    if (!/^[a-zA-Z][a-zA-Z0-9._-]{1,50}$/.test(key)) return App.toast('key 格式不正確', 'err');
    if (S.getAllText()[key]) return App.toast('此 key 已存在', 'err');
    S.setText({ [key]: { zh: '新文案(請填中文)', en: 'New text (English)' } });
    App.toast('已新增 key ' + key + ',請編輯內容並在頁面加入 data-t="' + key + '" 標記', 'ok', 5000);
    renderTextEditor();
  };
}

        ⚠️ <b>重要</b>:Key 屬於哪個 Email,通知就只會寄到那個信箱(且會寄到該 Email 的 inbox;非您在本系統的「收件 Email」欄)。<br>

function saveSettings() {
  const tplOwnerSub = (document.getElementById('s_tplOwnerSub') || {}).value || '';
  const tplOwnerBody = (document.getElementById('s_tplOwnerBody') || {}).value || '';
  const tplCustSub = (document.getElementById('s_tplCustSub') || {}).value || '';
  const tplCustBody = (document.getElementById('s_tplCustBody') || {}).value || '';
  const tplBundleSub = (document.getElementById('s_tplBundleSub') || {}).value || '';
  const tplBundleBody = (document.getElementById('s_tplBundleBody') || {}).value || '';
  /* 取貨方式運費(陣列更新) */
  const curShip = S.getSettings().shipMethods || [];
  const newShip = curShip.map((m, i) => {
    const inp = document.querySelector('[data-shipFee="' + i + '"]');
    return Object.assign({}, m, { fee: inp ? (Math.max(0, +inp.value || 0)) : m.fee });
  });
  const patch = {
    shopName: document.getElementById('s_shop').value,
    ownerEmail: document.getElementById('s_owner').value,
    shippingFee: +document.getElementById('s_ship').value || 0,
    freeShipAbove: +document.getElementById('s_free').value || 0,
    taxRate: +document.getElementById('s_tax').value || 0,
    lowStockAlert: +document.getElementById('s_low').value || 0,
    provider: document.getElementById('s_provider').value,
    notifyCustomer: document.getElementById('s_notifyC').checked,
    shipMethods: newShip,
    emailTemplates: {
      ownerNewOrder: { subject: tplOwnerSub, body: tplOwnerBody },
      customerReport: { subject: tplCustSub, body: tplCustBody },
      orderBundle: { subject: tplBundleSub, body: tplBundleBody }
    },
    web3forms: { accessKey: document.getElementById('s_w3') ? document.getElementById('s_w3').value : S.getSettings().web3forms.accessKey },
    formspree: { endpoint: document.getElementById('s_fs') ? document.getElementById('s_fs').value : S.getSettings().formspree.endpoint },
    emailjs: {
      serviceId: document.getElementById('s_ej1') ? document.getElementById('s_ej1').value : S.getSettings().emailjs.serviceId,
      templateId: document.getElementById('s_ej2') ? document.getElementById('s_ej2').value : S.getSettings().emailjs.templateId,
      publicKey: document.getElementById('s_ej3') ? document.getElementById('s_ej3').value : S.getSettings().emailjs.publicKey
    },
    baziReportUrl: document.getElementById('s_baziUrl') ? document.getElementById('s_baziUrl').value.trim() : S.getSettings().baziReportUrl
  };
  const cur = document.getElementById('s_cur').value, nw = document.getElementById('s_new').value;
  const newLogin = document.getElementById('s_login').value.trim();
  const changingAuth = newLogin !== S.getSettings().adminLogin || !!nw;
  if (changingAuth) {
    if (cur !== S.getSettings().adminPass) { App.toast('修改帳號/密碼需先輸入目前密碼', 'err'); return; }
    patch.adminLogin = newLogin;
    if (nw) patch.adminPass = nw;
  }
  S.saveSettings(patch);
  document.getElementById('s_msg').textContent = '設定已儲存 ✓';
  setTimeout(() => document.getElementById('s_msg').textContent = '', 2500);
  renderKpi();
}
async function testEmail() {
  const msg = document.getElementById('s_msg');
  const s = S.getSettings();
  if (s.provider === 'none' || !s.provider) {
    msg.innerHTML = '✗ 尚未選擇 Email 服務商(目前:none)';
    App.toast('請先選擇 Email 服務商並儲存', 'err');
    return;
  }
  if (!s.ownerEmail) {
    msg.innerHTML = '✗ 尚未填寫收件 Email';
    return;
  }
  if (s.provider === 'web3forms' && (!s.web3forms.accessKey || s.web3forms.accessKey === '1f03c247-a180-4912-bff3-2c92d395ab90')) {
    msg.innerHTML = '⚠ <b>您正在使用預設的測試 Access Key</b>(1f03c247…)。請到 <a href="https://web3forms.com" target="_blank" rel="noopener">web3forms.com</a> 註冊取得屬於您自己的 Key,並貼到上方的「Web3Forms Access Key」,否則信件會寄到測試帳號,而不是您的信箱。';
    App.toast('請先設定您自己的 Web3Forms Access Key', 'err', 6000);
    return;
  }
  msg.textContent = '發送中…(請看 console / F12 取得請求細節)';
  console.group('📨 Web3Forms 測試送信');
  console.log('provider:', s.provider, '| target ownerEmail:', s.ownerEmail);
  console.log('access_key(masked):', s.web3forms.accessKey ? s.web3forms.accessKey.slice(0, 4) + '…' + s.web3forms.accessKey.slice(-4) : '(none)');
  const r = await S.sendTestEmail();
  console.log('result:', r);
  console.groupEnd();
  let html = '';
  if (r.ok) {
    html = '✓ ' + App.esc(r.msg) + '<br>🎯 通知會寄到與 access_key 綁定的 Email(若您用 Web3Forms 預設 key,則不會到您的店郵,請確認您的註冊 Email)。';
  } else {
    html = '✗ ' + App.esc(r.msg) + '<br>📋 <b>請檢查</b>:① access_key 是否正確 ② 是否有 <code>CORS</code> 被擋(看 F12) ③ 服務商帳號是否被鎖定';
  }
  msg.innerHTML = html;
  App.toast(r.ok ? '測試郵件已寄出' : r.msg, r.ok ? 'ok' : 'err');
}

    Store.saveBaziReportSections(def);
    App.toast('已恢復預設', 'ok');
    drawReport();
  };
  document.getElementById('rp_preview').onclick = () => App.previewBaziReport();
  const cSave = document.getElementById('c_save');
  if (cSave) cSave.onclick = () => {
    const obj = {
      show: document.getElementById('c_show').checked,
      name: document.getElementById('c_name').value.trim(),
      contact: document.getElementById('c_contact').value.trim(),
      y: document.getElementById('c_y').value.trim(),
      m: document.getElementById('c_m').value.trim(),
      d: document.getElementById('c_d').value.trim(),
      h: document.getElementById('c_h').value.trim(),
      mi: document.getElementById('c_mi').value.trim(),
      gender: document.getElementById('c_gender').value,
      tz: document.getElementById('c_tz').value.trim() === '' ? 8 : (+document.getElementById('c_tz').value),
      orderNo: document.getElementById('c_order').value.trim(),
      items: document.getElementById('c_items').value,
      notes: document.getElementById('c_notes').value
    };
    S.saveSettings({ baziReportCustomer: obj });
    const m = document.getElementById('c_msg'); m.textContent = '已儲存 ✓'; setTimeout(() => m.textContent = '', 2000);
    App.toast('已儲存客戶資料卡', 'ok');
  };
}
function drawReport() {
  const list = document.getElementById('rp_list');
  if (!list) return;
  const secs = Store.getBaziReportSections();
  if (!secs.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">📄</div><p>目前沒有章節,點上方「＋ 新增章節」開始</p></div>`;
    return;
  }
  list.innerHTML = secs.map((s, i) => `
    <div class="card" style="padding:14px 16px;${s.enabled === false ? 'opacity:.55' : ''}" data-id="${s.id}">
      <div class="row-between wrap-row" style="margin-bottom:8px;gap:10px">
        <div class="row" style="gap:10px;flex:1;min-width:200px">
          <span class="badge soft" style="min-width:30px;justify-content:center">#${i + 1}</span>
          <input class="input" data-f="title" value="${App.esc(s.title || '')}" style="font-weight:700;flex:1" placeholder="章節標題">
        </div>
        <div class="row wrap-row" style="gap:6px;align-items:center">
          <label class="switch" title="啟用/關閉">
            <input type="checkbox" data-f="enabled" ${s.enabled !== false ? 'checked' : ''}>
            <span class="slider"></span>
          </label>
          <span class="tiny ${s.enabled !== false ? 'pos' : 'muted'}" data-status style="min-width:50px">${s.enabled !== false ? '已啟用' : '已關閉'}</span>
          <button class="btn btn-ghost btn-xs" data-up ${i === 0 ? 'disabled' : ''}>↑</button>
          <button class="btn btn-ghost btn-xs" data-down ${i === secs.length - 1 ? 'disabled' : ''}>↓</button>
          <button class="btn btn-danger btn-xs" data-del>刪除</button>
        </div>
      </div>
      <textarea class="textarea" data-f="body" style="min-height:90px;font-family:inherit" placeholder="章節內容…">${App.esc(s.body || '')}</textarea>
    </div>`).join('');
  // 綁定事件
  list.querySelectorAll('[data-id]').forEach(card => {
    const id = card.dataset.id;
    const upd = (field, val) => Store.updateBaziReportSection(id, { [field]: val });
    card.querySelector('[data-f="title"]').oninput = e => upd('title', e.target.value);
    card.querySelector('[data-f="body"]').oninput = e => upd('body', e.target.value);
    const en = card.querySelector('[data-f="enabled"]');
    en.onchange = () => { upd('enabled', en.checked); const st = card.querySelector('[data-status]'); st.textContent = en.checked ? '已啟用' : '已關閉'; st.className = 'tiny ' + (en.checked ? 'pos' : 'muted'); card.style.opacity = en.checked ? '' : '.55'; };
    card.querySelector('[data-up]').onclick = () => { Store.moveBaziReportSection(id, 'up'); drawReport(); };
    card.querySelector('[data-down]').onclick = () => { Store.moveBaziReportSection(id, 'down'); drawReport(); };
    card.querySelector('[data-del]').onclick = () => { if (confirm('確定刪除此章節?')) { Store.deleteBaziReportSection(id); drawReport(); App.toast('已刪除'); } };
  });
}

/* ===== 資料備份 ===== */
function renderBackup() {
  document.getElementById('tabBody').innerHTML = `
    <div class="grid g2" style="gap:18px;align-items:start">
      <div class="card">
        <h3 class="h-3">匯出</h3>
        <p class="tiny muted" style="margin-top:8px">備份全部設定、產品與訂單為 JSON,或匯出 CSV / XLS 報表。</p>
        <div class="col" style="gap:10px;margin-top:14px">
          <button class="btn btn-primary btn-sm" id="b_json">匯出全部 (JSON)</button>
          <button class="btn btn-ghost btn-sm" id="b_xls">匯出全部工作表 (XLS · Excel 可開)</button>
          <div style="height:6px"></div>
          <button class="btn btn-ghost btn-sm" id="b_ocsv">匯出訂單 (CSV)</button>
          <button class="btn btn-ghost btn-sm" id="b_pcsv">匯出產品 (CSV)</button>
          <button class="btn btn-ghost btn-sm" id="b_scsv">匯出加購服務 (CSV)</button>
          <button class="btn btn-ghost btn-sm" id="b_ccsv">匯出水晶知識 (CSV)</button>
        </div>
      </div>
      <div class="card">
        <h3 class="h-3">匯入 / 重置</h3>
        <p class="tiny muted" style="margin-top:8px">從 JSON 還原（會覆蓋現有設定/產品/訂單）。重置會清空所有本機資料並恢復預設產品。</p>
        <div class="col" style="gap:10px;margin-top:14px">
          <label class="btn btn-ghost btn-sm" style="cursor:pointer">選擇 JSON 匯入<input type="file" id="b_file" accept=".json,application/json" style="display:none"></label>
          <button class="btn btn-danger btn-sm" id="b_reset">重置全部資料</button>
        </div>
      </div>
    </div>`;
  document.getElementById('b_json').onclick = () => App.download('crystal-atelier-backup.json', S.exportJSON(), 'application/json');
  document.getElementById('b_xls').onclick = () => App.download('auralite-export.xls', S.exportXLS(), 'application/vnd.ms-excel');
  document.getElementById('b_ocsv').onclick = () => App.download('orders.csv', S.ordersCSV(), 'text/csv');
  document.getElementById('b_pcsv').onclick = () => App.download('products.csv', S.productsCSV(), 'text/csv');
  document.getElementById('b_scsv').onclick = () => App.download('services.csv', S.servicesCSV(), 'text/csv');
  document.getElementById('b_ccsv').onclick = () => App.download('crystals.csv', S.crystalsCSV(), 'text/csv');
  document.getElementById('b_file').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { S.importJSON(r.result); App.toast('已匯入', 'ok'); renderAll(); } catch (err) { App.toast('匯入失敗: ' + err.message, 'err'); } };
    r.readAsText(f);
  };
  document.getElementById('b_reset').onclick = () => {
    if (confirm('確定重置?這將清空所有訂單、產品與設定,並恢復預設 46 款產品。')) { S.resetAll(); App.toast('已重置'); renderAll(); }
  };
}
</script>
